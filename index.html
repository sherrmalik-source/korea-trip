ood"}], "map": "https://maps.google.com/?q=Jagalchi+Fish+Market+Busan"}, {"transport": "5 min walk"}, {"time": "2:30pm", "name": "BIFF Square + Nampo-dong", "type": "Street Food + Local Shopping", "desc": "Named after the Busan International Film Festival. Great street food and local energy.", "tags": [{"t": "Street food 2,000-5,000 won", "c": "food"}, {"t": "Open 24hrs", "c": "tip"}], "map": "https://maps.google.com/?q=BIFF+Square+Busan"}, {"transport": "5 min walk"}, {"time": "4pm", "name": "Bosu Book Street", "type": "Atmospheric Side Street · Korean War Legacy", "desc": "Narrow alley lined with second-hand booksellers dating to the Korean War era. More about atmosphere than buying.", "tags": [{"t": "Free to browse", "c": "free"}, {"t": "10am-8:30pm", "c": "tip"}], "map": "https://maps.google.com/?q=Bosu+Book+Street+Busan"}], "eats": [{"meal": "Lunch", "name": "Jagalchi Market Upstairs", "type": "Live Seafood · Cooked to Order", "desc": "This IS your lunch today. Buy from vendors on the ground floor (point and gesture — they understand), pay the cooking fee, and head upstairs. King crab, grilled clams, sea urchin, whole fish. This is what Busan is about — seafood so fresh it was swimming an hour ago.", "order": "Point to whatever looks good. Sea urchin and grilled clams are unmissable. Wash it down with cold Cass beer. Use Google Translate camera for the menu upstairs.", "tags": [{"t": "Seafood", "c": "food"}, {"t": "No reservation", "c": "tip"}, {"t": "40,000-80,000 won", "c": "food"}, {"t": "Use Google Translate", "c": "tip"}], "map": "https://maps.google.com/?q=Jagalchi+Fish+Market+Busan"}, {"meal": "Dinner", "name": "Dakbokkeumtang near Nampo", "type": "Spicy Braised Chicken Stew · Local Busan Style", "desc": "Dakbokkeumtang is a spicy braised chicken stew with potatoes and vegetables in gochujang sauce — one of the most deeply satisfying Korean chicken dishes and a Busan specialty. Walk around the Nampo area and look for small local spots with this on the sign. These hole-in-the-wall places are where locals eat after a day at the market.", "order": "One pot of dakbokkeumtang. Add rice. The sauce is for soaking your rice into — do not waste a drop. Ask for extra spicy (deo maepge) if you want heat.", "tags": [{"t": "Spicy chicken stew", "c": "food"}, {"t": "~12,000-16,000 won", "c": "food"}, {"t": "No reservation", "c": "tip"}, {"t": "Local neighborhood spot", "c": "tip"}], "map": "https://maps.google.com/?q=dakbokkeumtang+Nampo+Busan"}], "cafes": [{"time": "Morning · inside Gamcheon", "name": "Avant Garde Cafe", "type": "Hidden View Cafe · Inside Gamcheon Village", "desc": "A hidden cafe inside Gamcheon Culture Village with the best view in the whole village — surrounded by colorful houses cascading down on all sides. Easy to miss, worth finding. Sit outside if you can.", "order": "Iced Americano or latte. The view is the main event here. Around 6,000-8,000 won.", "map": "https://maps.google.com/?q=Avant+Garde+cafe+Gamcheon+Busan"}, {"time": "Afternoon · 4pm", "name": "WERK Coffee Roasters", "type": "Specialty Coffee Institution · Jeonpo area", "desc": "One of the most respected specialty coffee roasters in Busan, established 2017. Their Jeonpo branch has church pews, slit windows, minimalist lounge music — like a chapel for coffee people. Serious beans, serious craft.", "order": "Filter coffee (their house roast) or an espresso-based drink. They take their coffee very seriously — just tell them what you usually like.", "map": "https://maps.google.com/?q=WERK+coffee+Jeonpo+Busan"}], "timeline": [{"time": "9am", "name": "Avant Garde Cafe", "type": "Hidden View Cafe · Inside Gamcheon Village", "stopType": "cafe", "desc": "A hidden cafe inside Gamcheon Culture Village with the best view in the whole village — colorful houses cascading down on all sides. Easy to miss, worth finding. Sit outside.", "order": "Iced Americano or latte. The view is the main event. ~₩6,000–8,000.", "hours": "9am–6pm daily", "walk_next": "Already inside Gamcheon", "map": "https://maps.google.com/?q=Avant+Garde+cafe+Gamcheon+Busan"}, {"time": "9am", "name": "Gamcheon Culture Village", "type": "Colorful Hillside Village · Early Entry", "stopType": "place", "desc": "Buy the ₩2,000 stamp map at the entrance — it leads you to the best photo spots. Wear comfortable shoes. Go early before tour groups arrive.", "hours": "9am–6pm daily", "walk_next": "Bus or taxi to Jagalchi (~15 min)", "uber_next": "₩12,000 / 18 min", "tags": [{"t": "Entry ₩2,000", "c": "ticket"}, {"t": "Go early", "c": "warn"}], "map": "https://maps.google.com/?q=Gamcheon+Culture+Village+Busan"}, {"transport": "🚌 Bus or taxi to Jagalchi Fish Market — ~15 min, ₩12,000 taxi"}, {"time": "11:30am", "name": "Jagalchi Fish Market — Lunch", "type": "Korea's Biggest Seafood Market · Pick + Cook", "stopType": "food", "desc": "Pick live seafood from vendors on the ground floor, pay a small cooking fee (~₩5,000), eat it cooked upstairs. Sea urchin, grilled clams, king crab. One of the most memorable meals of the whole trip.", "order": "Point to whatever looks good. Sea urchin and grilled clams are unmissable. Cold Cass beer. Use Google Translate camera for the menu upstairs.", "hours": "9am–9pm daily", "walk_next": "5 min walk to BIFF Square", "tags": [{"t": "Seafood", "c": "food"}, {"t": "₩30,000-80,000 total", "c": "food"}, {"t": "Use Google Translate", "c": "tip"}], "map": "https://maps.google.com/?q=Jagalchi+Fish+Market+Busan", "etiquette": "Ground floor: point at live seafood in tanks, negotiate price. Pay cooking fee (~₩5,000) to take it upstairs. Upstairs: sit at any open table, staff cook it for you. Use Google Translate camera for the menu."}, {"time": "2:30pm", "name": "BIFF Square + Nampo-dong", "type": "Street Food + Local Shopping", "stopType": "place", "desc": "Named after the Busan International Film Festival. Great street food and local energy.", "hours": "Open 24hrs", "walk_next": "5 min walk to Bosu Book Street", "tags": [{"t": "Street food ₩2,000-5,000", "c": "food"}], "map": "https://maps.google.com/?q=BIFF+Square+Busan"}, {"time": "4pm", "name": "Bosu Book Street", "type": "Atmospheric Alley · Korean War Legacy", "stopType": "place", "desc": "Narrow alley lined with second-hand booksellers dating to the Korean War era. More about atmosphere than buying.", "hours": "10am–8:30pm", "walk_next": "20 min walk or taxi to WERK Coffee", "uber_next": "₩7,000 / 10 min", "tags": [{"t": "Free to browse", "c": "free"}], "map": "https://maps.google.com/?q=Bosu+Book+Street+Busan"}, {"transport": "🚕 Taxi to Jeonpo area — ~₩7,000, 10 min"}, {"time": "5pm", "name": "WERK Coffee Roasters", "type": "Specialty Coffee Institution · Jeonpo", "stopType": "cafe", "desc": "One of the most respected specialty roasters in Busan. Church pews, slit windows, minimalist lounge music — like a chapel for coffee people. Serious beans, serious craft.", "order": "Filter coffee (house roast) or espresso-based. Tell them what you usually like.", "hours": "11am–9pm daily", "walk_next": "Taxi back to Gwangalli apartment", "uber_next": "₩15,000 / 20 min to Nampo", "map": "https://maps.google.com/?q=WERK+coffee+Jeonpo+Busan"}, {"time": "7pm", "name": "Dakbokkeumtang near Nampo", "type": "Spicy Braised Chicken Stew · Busan Specialty", "stopType": "food", "desc": "Spicy braised chicken stew with potatoes and vegetables in gochujang sauce. Walk around the Nampo area and look for small local spots with this on the sign.", "order": "One pot of dakbokkeumtang + rice. The sauce is for soaking rice — don't waste a drop. Ask 더 맵게 (deo maepge) for extra spicy.", "hours": "Most open 5pm–10pm", "walk_next": "Taxi back to Gwangalli apartment", "uber_next": "₩18,000 / 25 min", "tags": [{"t": "Spicy chicken stew", "c": "food"}, {"t": "~12,000-16,000 won", "c": "food"}, {"t": "No reservation", "c": "tip"}], "map": "https://maps.google.com/?q=dakbokkeumtang+Nampo+Busan", "etiquette": "Walk into any local spot, point at the sign or say 닭볶음탕 (dakbokkeumtang). They'll bring a pot to your table. Pour sauce over rice. Call server with 저기요."}], "alternatives": [{"name": "Jeongjitgan", "type": "Michelin Bib 2025 · Busan-style Dwaeji-gukbap · Sinpyeong-dong", "desc": "New 2025 Michelin Bib — Busan pork rice soup. If you want something lighter than spicy chicken stew.", "map": "https://maps.google.com/?q=Jeongjitgan+Busan"}, {"name": "Any BIFF Square street food", "type": "Quick snack in the afternoon", "desc": "Ssiat hotteok (seed-filled sweet pancake) is the Busan street food — different from Seoul's version, more filling.", "map": "https://maps.google.com/?q=BIFF+Square+hotteok+Busan"}], "tldr": "Morning taxi to Gamcheon village (~₩15,000, 20 min from your apartment). Then Jagalchi Fish Market for lunch + Nampo/BIFF Square afternoon. Coffee at WERK, dinner back near Nampo. Taxi home to Gwangalli ~₩10,000."}, {"id": 8, "date": "Apr 1", "dow": "Wed", "city": "Busan", "title": "Haedong Temple + Beaches", "subtitle": "Coastal Buddhist temple, two beaches, a cliff village, and the best seafood dinner of the trip.", "alerts": [{"type": "tip", "text": "From your Gwangalli apartment: Kakao Taxi to Haedong Yonggungsa ~₩18,000, 35 min. OR taxi to Haeundae first (~₩12,000, 18 min) then bus 181 to temple."}, {"type": "tip", "text": "Gwangalli Beach is literally your backyard — Millak Raw Fish Town is a 2 min walk from your apartment. Best seat in the house for the bridge view."}], "bookings": [], "stops": [{"time": "8:30am", "name": "Haedong Yonggungsa Temple", "type": "Coastal Buddhist Temple", "desc": "One of the only seaside Buddhist temples in Korea — built directly into the rocky coastline. Stunning in any weather. Allow 1-1.5 hrs.", "tags": [{"t": "Free entry", "c": "free"}, {"t": "4am-8pm daily", "c": "tip"}, {"t": "Early = no crowds", "c": "tip"}], "map": "https://maps.google.com/?q=Haedong+Yonggungsa+Temple+Busan"}, {"transport": "Bus or taxi to Haeundae Beach (~30 min)"}, {"time": "11am", "name": "Haeundae Beach", "type": "Busan's Famous Beach", "desc": "Walk the 1.5km white sand stretch. In early April it is uncrowded — locals use it as a morning promenade. Great cafes on the beachfront.", "tags": [{"t": "Free", "c": "free"}, {"t": "Cafes from 8am", "c": "tip"}], "map": "https://maps.google.com/?q=Haeundae+Beach+Busan"}, {"transport": "Line 2: Haeundae to Gwangan (~10 min, 1,500 won)"}, {"time": "4:30-8pm", "name": "Gwangalli Beach + Gwangan Bridge", "type": "Sunset + Evening", "desc": "More local than Haeundae. Wide pedestrian strip lined with restaurants. Bridge lights up at dusk — find a cafe table facing the water.", "tags": [{"t": "Free", "c": "free"}, {"t": "Bridge lit at sunset", "c": "tip"}, {"t": "Great restaurants on strip", "c": "tip"}], "map": "https://maps.google.com/?q=Gwangalli+Beach+Busan"}], "eats": [{"meal": "Lunch", "name": "Gimbap and Tteokbokki near Haeundae", "type": "Local Snack Stalls · Haeundae Market Area", "desc": "Near Haeundae market (5 min walk inland from the beach), there are rows of local snack stalls. Perfect light lunch before a beach afternoon.", "order": "Gimbap (seaweed rice rolls with egg or tuna), tteokbokki (spicy rice cakes). Both 3,000-5,000 won.", "tags": [{"t": "3,000-6,000 won", "c": "food"}, {"t": "Haeundae market area", "c": "tip"}], "map": "https://maps.google.com/?q=Haeundae+Market+Busan"}, {"meal": "Dinner", "name": "Millak Raw Fish Town", "type": "Seafood · Gwangalli Bridge Views", "desc": "A 10-story building at the north end of Gwangalli Beach. Ground floor is a fresh market, upper floors are ~300 restaurants, many with direct bridge views. Buy your seafood downstairs, get it cooked upstairs at your table. Best way to spend a Gwangalli sunset.", "order": "Sashimi platter, grilled clams, haemul pajeon (seafood pancake — the Busan version is thicker and better than Seoul's). Order with cold beer and watch the bridge lights turn on.", "tags": [{"t": "Seafood", "c": "food"}, {"t": "Bridge views", "c": "tip"}, {"t": "No reservation", "c" :30am", "name": "Momo Coffee Haeundae", "type": "Specialty Coffee · Haeundae · 18 min from your apartment", "stopType": "cafe", "desc": "Opens at 7am — one of the most beloved specialty spots in Busan with a devoted local following. Clean, calm interior, excellent beans. Grab this before the temple run.", "order": "Flat white or filter coffee. One of the best cups in Busan. Under ₩7,000.", "hours": "7am–10pm daily", "walk_next": "Kakao Taxi to temple from Haeundae", "uber_next": "₩18,000 / 35 min to Haedong Temple", "map": "https://maps.google.com/?q=Momos+Coffee+Haeundae+Busan"}, {"transport": "🚌 Bus 181 from Haeundae OR taxi ~₩15,000 directly to Haedong Yonggungsa (~40 min)"}, {"time": "8:30am", "name": "Haedong Yonggungsa Temple", "type": "Coastal Buddhist Temple · Seaside Cliffs", "stopType": "place", "desc": "One of the only seaside Buddhist temples in Korea — built directly into the rocky coastline. Stunning in any weather. Allow 1–1.5 hrs.", "hours": "4am–8pm daily", "walk_next": "Bus or taxi back to Haeundae (~30 min)", "uber_next": "₩15,000 taxi", "tags": [{"t": "Free entry", "c": "free"}, {"t": "Early = no crowds", "c": "tip"}], "map": "https://maps.google.com/?q=Haedong+Yonggungsa+Temple+Busan"}, {"transport": "🚌 Bus or taxi back to Haeundae Beach — ~30 min"}, {"time": "11am", "name": "Haeundae Beach Walk", "type": "Busan's Famous Beach · 1.5km White Sand", "stopType": "place", "desc": "Walk the full 1.5km stretch. In early April it's uncrowded — locals use it as a morning promenade.", "hours": "Open 24hrs", "walk_next": "5 min walk to lunch market", "tags": [{"t": "Free", "c": "free"}], "map": "https://maps.google.com/?q=Haeundae+Beach+Busan"}, {"time": "12pm", "name": "Gimbap + Tteokbokki · Haeundae Market", "type": "Street Snacks · Near the Beach", "stopType": "snack", "desc": "Near Haeundae market (5 min walk inland from the beach) — rows of local snack stalls. Perfect light lunch before the afternoon beach session.", "order": "Gimbap (seaweed rice rolls with egg or tuna) + tteokbokki (spicy rice cakes). Both ₩3,000–5,000.", "hours": "Most stalls open 10am–8pm", "walk_next": "Back to beach or subway to Gwangalli", "tags": [{"t": "₩3,000-6,000 won", "c": "food"}, {"t": "Quick and easy", "c": "tip"}], "map": "https://maps.google.com/?q=Haeundae+Market+Busan"}, {"transport": "🚕 Taxi to Huinnyeoul Culture Village — ~₩15,000, 20 min from Haeundae"}, {"time": "2pm", "name": "Huinnyeoul Culture Village (흰여울문화마을)", "type": "Coastal Cliff Village · Ocean Views · Busan", "stopType": "place", "desc": "A stunning seaside village built into the cliffs above the Korea Strait — pastel-coloured houses, murals, and coastal walking paths with sweeping ocean views. Completely different from Gamcheon — quieter, more dramatic, with the sea right below you. The Influenza alley and Yeong-do Cliff Walk are the highlights.", "hours": "Always open (residential area). Best 1–4pm for light.", "walk_next": "Walk the coastal path", "uber_next": "₩10,000 / 15 min to Gwangalli", "tags": [{"t": "Free", "c": "free"}, {"t": "Coastal walk", "c": "tip"}, {"t": "Less touristy than Gamcheon", "c": "tip"}, {"t": "Wear comfortable shoes", "c": "warn"}], "map": "https://maps.google.com/?q=Huinnyeoul+Culture+Village+Busan", "etiquette": "Residential area — keep noise down. Don't enter private homes even if doors are open. Paths are narrow, let others pass."}, {"transport": "🚕 Taxi to Gwangalli Beach — ~₩10,000, 15 min"}, {"time": "4:30pm", "name": "Gwangalli Beach", "type": "More Local Than Haeundae · Bridge Views", "stopType": "place", "desc": "This is basically your front yard — Gwangalli Beach is steps from your apartment. Wide pedestrian strip lined with restaurants. Arrive around 5pm for the bridge lights at dusk.", "hours": "Open 24hrs", "walk_next": "On the strip", "tags": [{"t": "Free", "c": "free"}, {"t": "Bridge lit at dusk", "c": "tip"}, {"t": "2 min walk from apartment", "c": "free"}], "map": "https://maps.google.com/?q=Gwangalli+Beach+Busan"}, {"time": "5pm", "name": "Casa Busano", "type": "European Terrace Cafe · Gwangalli · Walking Distance", "stopType": "cafe", "desc": "European-inspired cafe along the Gwangalli strip — particularly beautiful as the bridge starts to light up at dusk. Lovely pastries, outdoor terrace facing the water.", "order": "Iced latte or cold brew + whatever pastry looks good. Sit outside facing the bridge.", "hours": "10am–11pm daily", "walk_next": "2 min walk to Millak for dinner", "map": "https://maps.google.com/?q=Casa+Busano+Gwangalli+Busan"}, {"time": "7pm", "name": "Millak Raw Fish Town", "type": "Seafood · 300 Restaurants · Bridge Views", "stopType": "food", "desc": "You are literally staying next door to Millak Raw Fish Town — it's a 2 min walk from your apartment. 10-story building, ground floor market, ~300 restaurants upstairs with Gwangan Bridge views. Buy seafood downstairs, cook upstairs at your table.", "order": "Sashimi platter + grilled clams + haemul pajeon (seafood pancake — Busan version is thicker). Order with cold beer and watch the bridge lights turn on.", "hours": "10am–midnight daily", "walk_next": "2 min walk back to your apartment", "uber_next": null, "tags": [{"t": "Seafood", "c": "food"}, {"t": "Bridge views", "c": "tip"}, {"t": "₩30,000-60,000 won", "c": "food"}, {"t": "No reservation", "c": "tip"}], "map": "https://maps.google.com/?q=Millak+Raw+Fish+Town+Gwangalli+Busan", "etiquette": "Buy from ground floor market first, then take it to any restaurant upstairs — they'll cook it at your table. Point and gesture, Google Translate helps. Very communal atmosphere."}], "alternatives": [{"name": "Hanwolgwan", "type": "Michelin Bib 2025 · Beef Bone Soup · Gwangan-dong", "desc": "New 2025 Michelin Bib — rich beef bone gomtang right near Gwangalli. Good lunch alternative if you want something warmer than market snacks.", "map": "https://maps.google.com/?q=Hanwolgwan+Gwangan+Busan"}, {"name": "Any Haeundae beachfront cafe", "type": "Post-temple coffee if Momo is full", "desc": "The entire beachfront strip has good cafes. Momo is the best but any specialty coffee shop on the strip works.", "map": "https://maps.google.com/?q=cafe+Haeundae+Beach+Busan"}], "tldr": "Big day. Taxi to Haeundae for coffee then temple (~35 min), Haeundae beach, Huinnyeoul cliff village, then taxi back to Gwangalli — which is literally your front yard. Millak Raw Fish Town is a 2 min walk from your apartment. Best seat for the bridge lights."}, {"id": 9, "date": "Apr 2", "dow": "Thu", "city": "Busan", "title": "Haeundae + Seomyeon — Last Full Day", "subtitle": "A full last day in Busan. Beach morning, city afternoon, great dinner before your final night.", "alerts": [{"type": "tip", "text": "Gimhae Airport (PUS): Allow 1.5 hrs before flight. Airport Limousine Bus from Seomyeon (~40 min, 7,000 won) or subway Line 2 to Sasang then Line 3 to Airport (~50 min)."}], "bookings": [], "stops": [{"time": "Morning", "name": "Haeundae Beach Walk", "type": "Final Morning", "desc": "Walk the beach one last time. Quieter on a weekday morning. Great cafes along the strip.", "tags": [{"t": "Free", "c": "free"}], "map": "https://maps.google.com/?q=Haeundae+Beach+Busan"}, {"transport": "Subway Line 2 to Seomyeon (~20 min)"}, {"time": "Afternoon", "name": "Seomyeon District", "type": "Busan Downtown · Shopping", "desc": "Shops, Korean cosmetics, underground arcade. Last chance to buy anything before the airport tomorrow.", "tags": [{"t": "Shops from 10am", "c": "tip"}, {"t": "K-beauty + clothing", "c": "shop"}], "map": "https://maps.google.com/?q=Seomyeon+Busan"}, {"time": "Evening", "name": "Final Dinner in Busan", "type": "Your last Korean meal", "desc": "See eats section — make it count.", "tags": [{"t": "Easy walk from Seomyeon", "c": "tip"}], "map": "https://maps.google.com/?q=Seomyeon+Busan"}], "eats": [{"meal": "Lunch", "name": "Milmyeon — any local spot in Seomyeon", "type": "Busan Cold Noodles · Cannot Get This Outside Busan", "desc": "Milmyeon is Busan's cold wheat noodle dish, born from Korean War refugees. It is the city's most local food — you genuinely cannot get an authentic bowl outside Busan. Look for any restaurant with the milmyeon sign near Seomyeon station.", "order": "One bowl mul milmyeon (cold broth, mild) + one bowl bibim milmyeon (spicy mixed version) to try both. Add a soft-boiled egg. Pour a splash of vinegar into the cold broth version for brightness.", "tags": [{"t": "Busan-only dish", "c": "tip"}, {"t": "7,000-10,000 won", "c": "food"}, {"t": "No reservation", "c": "tip"}], "map": "https://maps.google.com/?q=milmyeon+Seomyeon+Busan"}, {"meal": "Dinner", "name": "100.1.Pyeongnaeng", "type": "Michelin Bib Gourmand 2025 · Pyongyang Naengmyeon · Namcheon-dong", "desc": "One of four brand new 2025 Michelin Bib Gourmand additions in Busan. Chef Kwak Dong-hoon toured naengmyeon restaurants all over Korea to perfect his recipe — the Pyongyang-style cold noodle bowl here has a delicate, subtle broth that shows real mastery. Pairs beautifully with bulgogi and mandu. A special final dinner that feels local and earned.", "order": "Pyongyang naengmyeon (cold buckwheat noodles in chilled broth) + mandu + bulgogi if you want a full meal. Pour in a splash of the vinegar and mustard on the table. Under ₩20,000 total.", "tags": [{"t": "Michelin Bib Gourmand 2025", "c": "ticket"}, {"t": "New this year", "c": "tip"}, {"t": "Cold noodles", "c": "food"}, {"t": "No reservation", "c": "tip"}, {"t": "~12,000-18,000 won", "c": "food"}], "map": "https://maps.google.com/?q=100.1.Pyeongnaeng+Namcheon+Busan"}], "cafes": [{"time": "Morning · Haeundae", "name": "Momo Coffee Haeundae", "type": "Specialty Coffee · Near Your Hotel", "desc": "Already your go-to — one last cup here before the beach walk.", "order": "Iced Americano. Korea farewell ritual.", "map": "https://maps.google.com/?q=Momos+Coffee+Haeundae+Busan"}, {"time": "Afternoon · Seomyeon", "name": "Blackup Coffee Seomyeon", "type": "Popular Local Coffee Brand · Seomyeon", "desc": "Busan-born coffee chain with a cult local following. Central Seomyeon location. Perfect afternoon coffee before packing.", "order": "Iced Americano. 3,500-5,000 won.", "map": "https://maps.google.com/?q=Blackup+Coffee+Seomyeon+Busan"}], "timeline": [{"time": "Morning", "name": "Coffee near Gwangalli", "type": "Any Cafe on the Gwangalli Strip · Steps from Apartment", "stopType": "cafe", "desc": "The Gwangalli beachfront strip has great cafes right outside your door. Grab a coffee and walk the beach one last time before heading to Seomyeon.", "order": "Iced Americano. ₩4,000–5,000. Drink it slowly.", "hours": "7am–10pm daily", "walk_next": "Walk the beach", "map": "https://maps.google.com/?q=cafe+Gwangalli+Beach+Busan"}, {"time": "Morning", "name": "Gwangalli Beach — Final Morning Walk", "type": "Your Front Yard · Last Morning", "stopType": "place", "desc": "Walk the Gwangalli strip one last time — quiet on a Thursday morning. The bridge looks different in daylight.", "hours": "Open 24hrs", "walk_next": "Subway Line 2 to Seomyeon (~20 min)", "uber_next": "₩12,000 / 18 min", "tags": [{"t": "Free", "c": "free"}], "map": "https://maps.google.com/?q=Gwangalli+Beach+Busan"}, {"transport": "🚇 Subway: Gwangalli area → Seomyeon (~15 min, Line 2) OR Kakao Taxi ~₩10,000, 15 min"}, {"time": "11am", "name": "Seomyeon District", "type": "Busan Downtown · Last Shopping", "stopType": "place", "desc": "Shops, Korean cosmetics, underground arcade. Last chance for K-beauty, snacks, and clothing before the airport tomorrow.", "hours": "Shops from 10am", "walk_next": "On the strip", "tags": [{"t": "K-beauty + clothing", "c": "shop"}], "map": "https://maps.google.com/?q=Seomyeon+Busan"}, {"time": "12:30pm", "name": "Milmyeon — Seomyeon", "type": "Busan Cold Noodles · Cannot Get Outside Busan", "stopType": "food", "desc": "Milmyeon is Busan's cold wheat noodle dish, born from Korean War refugees. Genuinely cannot get an authentic bowl outside Busan. Look for any restaurant let currentDay = 1;
let cityFilter = 'all';

function getCityClass(day) {
  const c = day.city.toLowerCase();
  if (c.includes('busan') && c.includes('seoul')) return 'transit';
  if (c.includes('busan')) return 'busan';
  return 'seoul';
}

function buildNav() {
  const scroll = document.getElementById('dayScroll');
  const bottom = document.getElementById('bottomNav');
  scroll.innerHTML = '';
  bottom.innerHTML = '';

  DAYS.forEach(day => {
    const cls = getCityClass(day);
    const isVisible = cityFilter === 'all' || cls === cityFilter || cls === 'transit';

    // Top scroll pills
    const pill = document.createElement('div');
    pill.className = `day-pill ${cls} ${day.id === currentDay ? 'active' : ''} ${!isVisible ? 'hidden' : ''}`;
    pill.style.display = isVisible ? '' : 'none';
    pill.innerHTML = `<div class="pill-num">${day.date.split(" ")[1]}</div><div class="pill-dow">${day.dow}</div><div class="pill-city-dot"></div>`;
    pill.onclick = () => selectDay(day.id);
    scroll.appendChild(pill);

    // Bottom nav
    const dot = document.createElement('div');
    dot.className = `nav-dot ${cls}-city ${day.id === currentDay ? 'active' : ''}`;
    dot.style.display = isVisible ? '' : 'none';
    dot.textContent = day.date.split(" ")[1];
    dot.onclick = () => selectDay(day.id);
    bottom.appendChild(dot);
  });
}

function selectDay(id) {
  currentDay = id;
  buildNav();
  renderDay();
  window.scrollTo({top: 0, behavior: 'instant'});
}

function filterCity(city, btn) {
  cityFilter = city;
  document.querySelectorAll('.city-btn').forEach(b => b.className = 'city-btn');
  btn.className = `city-btn active-${city}`;
  // jump to first visible day
  const first = DAYS.find(d => {
    const cls = getCityClass(d);
    return city === 'all' || cls === city || cls === 'transit';
  });
  if (first) currentDay = first.id;
  buildNav();
  renderDay();
  window.scrollTo({top: 0, behavior: 'instant'});
}

function tagHtml(tags) {
  if (!tags || !tags.length) return '';
  return '<div class="tags">' + tags.map(t => `<span class="tag ${t.c}">${t.t}</span>`).join('') + '</div>';
}

function mapLink(url) {
  if (!url) return '';
  return `<a href="${url}" class="map-link" target="_blank">📍 Open in Maps</a>`;
}

function renderDay() {
  const day = DAYS.find(d => d.id === currentDay);
  if (!day) return;
  const cls = getCityClass(day);

  let html = `<div class="day-view">`;

  // Day header
  html += `<div class="day-header">
    <div class="day-number-row">
      <span class="day-badge ${cls}">Day ${day.id} · ${day.date}</span>
      <span class="day-meta">${day.city}</span>
    </div>
    <div class="day-title">${day.title}</div>
    <div class="day-subtitle">${day.subtitle}</div>
  </div>`;

  // TLDR
  if (day.tldr) {
    html += `<div class="tldr-box">
      <div class="tldr-label">TL;DR</div>
      <div class="tldr-text">${day.tldr}</div>
    </div>`;
  }

  // Alerts
  if (day.alerts && day.alerts.length) {
    day.alerts.forEach(a => {
      const icon = a.type === 'warn' ? '⚠️' : '💡';
      html += `<div class="alert ${a.type}"><span class="alert-icon">${icon}</span><span>${a.text}</span></div>`;
    });
  }

  // Bookings
  if (day.bookings && day.bookings.length) {
    html += `<div class="bookings-section">
      <div class="bookings-title">📌 Book Before You Go</div>`;
    day.bookings.forEach(b => {
      html += `<a href="${b.link}" class="booking-card" target="_blank">
        <span class="booking-text">${b.text}</span>
        <span class="booking-btn">${b.label} →</span>
      </a>`;
    });
    html += `</div>`;
  }

  // Timeline
  const timeline = day.timeline || [];
  if (timeline.length) {
    html += `<div class="section-label">Schedule</div>`;
    
    for (let i = 0; i < timeline.length; i++) {
      const stop = timeline[i];
      const isLast = i === timeline.length - 1;

      if (stop.transport) {
        html += `<div class="transport">
          <div class="transport-left"><div class="transport-line"></div></div>
          <div class="transport-text">${stop.transport}</div>
        </div>`;
        continue;
      }

      const stopTypeClass = stop.stopType || 'place';
      const hasNav = stop.walk_next || stop.uber_next;

      html += `<div class="stop">
        <div class="stop-left">
          <div class="stop-time">${stop.time || ''}</div>
          <div class="stop-line"></div>
        </div>
        <div class="stop-dot stop-dot-${stopTypeClass}"></div>
        <div class="stop-body stop-body-${stopTypeClass}">
          <div class="stop-type-pill stop-pill-${stopTypeClass}">${getStopTypeIcon(stopTypeClass)} ${getStopTypeLabel(stopTypeClass)}</div>
          <div class="stop-name">${stop.name}</div>
          <div class="stop-type">${stop.type || ''}</div>`;

      if (stop.hours) {
        html += `<div class="stop-hours">🕐 ${stop.hours}</div>`;
      }

      html += `<div class="stop-desc">${stop.desc || ''}</div>`;

      if (stop.order) {
        html += `<div class="order-box">
          <div class="order-label">What to Order</div>
          <div class="order-text">${stop.order}</div>
        </div>`;
      }

      if (stop.etiquette) {
        html += `<div class="etiquette-box">
          <div class="order-label">🙏 Etiquette</div>
          <div class="order-text">${stop.etiquette}</div>
        </div>`;
      }

      if (stop.tags && stop.tags.length) {
        html += '<div class="tags">' + stop.tags.map(t => `<span class="tag ${t.c}">${t.t}</span>`).join('') + '</div>';
      }

      // Nav row: map + walk + uber
      html += `<div class="nav-row">`;
      if (stop.map) html += `<a href="${stop.map}" class="map-link" target="_blank">📍 Maps</a>`;
      if (!isLast && hasNav) {
        html += `<div class="nav-to-next">`;
        if (stop.walk_next) html += `<span class="nav-item walk">🚶 ${stop.walk_next}</span>`;
        if (stop.uber_next) html += `<span class="nav-item uber">🚕 Uber ${stop.uber_next}</span>`;
        html += `</div>`;
      }
      html += `</div>`;

      html += `</div></div>`; // stop-body, stop
    }
  }

  // Alternatives
  if (day.alternatives && day.alternatives.length) {
    html += `<div class="section-label">If Plans Change</div>`;
    day.alternatives.forEach(alt => {
      html += `<div class="alt-card">
        <div class="alt-name">${alt.name}</div>
        <div class="alt-type">${alt.type}</div>
        <div class="alt-desc">${alt.desc}</div>
        ${alt.map ? `<a href="${alt.map}" class="map-link" target="_blank">📍 Maps</a>` : ''}
      </div>`;
    });
  }

  // Desserts section
  if (day.desserts && day.desserts.length) {
    html += `<div class="section-label">🍡 Dessert Guide</div>`;
    day.desserts.forEach(d => {
      html += `<div class="dessert-card">
        <div class="dessert-name">${d.name}</div>
        <div class="dessert-type">${d.type}</div>
        <div class="dessert-desc">${d.desc}</div>
        ${d.map ? `<a href="${d.map}" class="map-link" target="_blank">📍 Maps</a>` : ''}
      </div>`;
    });
  }

  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function getStopTypeIcon(t) {
  switch(t) {
    case 'food': return '🍽';
    case 'cafe': return '☕';
    case 'snack': return '🥢';
    case 'place': return '📍';
    default: return '📍';
  }
}

function getStopTypeLabel(t) {
  switch(t) {
    case 'food': return 'Meal';
    case 'cafe': return 'Cafe';
    case 'snack': return 'Snack';
    case 'place': return 'Stop';
    default: return 'Stop';
  }
}


// Init
buildNav();
renderDay();
</script>
</body>
</html>
