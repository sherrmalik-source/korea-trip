<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Korea Trip">
<title>Korea Trip</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --accent: #e8c97e;
    --accent2: #c4a35a;
    --text: #f0ece4;
    --muted: #888;
    --seoul: #5b9bd5;
    --busan: #e07b5a;
    --green: #6abf7b;
    --red: #e05a5a;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: var(--bg);
    padding: calc(var(--safe-top) + 14px) 16px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid var(--border);
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .trip-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--accent);
  }

  .trip-dates {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* CITY FILTER */
  .city-filter {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }

  .city-btn {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .city-btn.active-all { background: var(--accent); color: #000; border-color: var(--accent); }
  .city-btn.active-seoul { background: var(--seoul); color: #fff; border-color: var(--seoul); }
  .city-btn.active-busan { background: var(--busan); color: #fff; border-color: var(--busan); }

  /* DAY SCROLL */
  .day-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 0 12px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .day-scroll::-webkit-scrollbar { display: none; }

  .day-pill {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    transition: all 0.2s;
    min-width: 48px;
  }
  .day-pill.active { background: var(--accent); border-color: var(--accent); }
  .day-pill.active .pill-num { color: #000; }
  .day-pill.active .pill-dow { color: #000; opacity: 0.6; }
  .day-pill.active .pill-city-dot { background: #000; opacity: 0.5; }
  .day-pill.seoul .pill-city-dot { background: var(--seoul); }
  .day-pill.busan .pill-city-dot { background: var(--busan); }
  .day-pill.transit .pill-city-dot { background: var(--accent2); }

  .pill-num { font-size: 15px; font-weight: 700; color: var(--text); line-height: 1; }
  .pill-dow { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.3px; }
  .pill-city-dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 4px; }

  /* MAIN CONTENT */
  .content {
    padding: 16px 16px calc(var(--safe-bottom) + 80px);
  }

  /* DAY CARD */
  .day-header {
    margin-bottom: 16px;
  }

  .day-number-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .day-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
  }
  .day-badge.seoul { background: rgba(91,155,213,0.2); color: var(--seoul); }
  .day-badge.busan { background: rgba(224,123,90,0.2); color: var(--busan); }
  .day-badge.transit { background: rgba(232,201,126,0.15); color: var(--accent); }

  .day-meta { font-size: 12px; color: var(--muted); }

  .day-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.1;
    margin-bottom: 6px;
  }

  .day-subtitle {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* ALERTS */
  .alert {
    display: flex;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.5;
  }
  .alert.tip { background: rgba(106,191,123,0.12); border-left: 3px solid var(--green); color: #c4f0cd; }
  .alert.warn { background: rgba(224,90,90,0.12); border-left: 3px solid var(--red); color: #f0c4c4; }
  .alert-icon { flex-shrink: 0; font-size: 14px; margin-top: 1px; }

  /* BOOKINGS */
  .bookings-section { margin-bottom: 16px; }
  .bookings-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .booking-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--accent2);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 6px;
    text-decoration: none;
  }
  .booking-text { font-size: 13px; color: var(--text); line-height: 1.4; flex: 1; }
  .booking-btn {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #000;
    background: var(--accent);
    padding: 4px 10px;
    border-radius: 6px;
    margin-left: 10px;
  }

  /* SECTION LABELS */
  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 20px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* STOPS */
  .stop {
    display: flex;
    gap: 12px;
    margin-bottom: 2px;
    position: relative;
  }

  .stop-left {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 44px;
    flex-shrink: 0;
  }

  .stop-time {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.2px;
    white-space: nowrap;
    margin-top: 14px;
  }

  .stop-line {
    width: 1px;
    flex: 1;
    background: var(--border);
    margin-top: 4px;
    min-height: 24px;
  }

  .stop-dot {
    position: absolute;
    left: 37px;
    top: 18px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
  }

  .stop-body {
    flex: 1;
    background: var(--surface);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 4px;
    border: 1px solid var(--border);
  }

  .stop-name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin-bottom: 2px;
  }

  .stop-type {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.2px;
  }

  .stop-desc {
    font-size: 13px;
    color: #bbb;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 8px;
  }

  .tag {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 5px;
    letter-spacing: 0.2px;
  }
  .tag.tip { background: rgba(106,191,123,0.15); color: #8ddb9e; }
  .tag.warn { background: rgba(224,90,90,0.15); color: #e08888; }
  .tag.ticket { background: rgba(232,201,126,0.15); color: var(--accent); }
  .tag.free { background: rgba(91,155,213,0.15); color: #8ab8e0; }
  .tag.food { background: rgba(180,120,200,0.15); color: #c8a0d8; }
  .tag.shop { background: rgba(200,160,80,0.15); color: #d4a84c; }

  .map-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    padding: 4px 0;
    letter-spacing: 0.3px;
  }

  /* TRANSPORT CONNECTOR */
  .transport {
    display: flex;
    gap: 12px;
    margin-bottom: 2px;
    align-items: stretch;
  }
  .transport-left {
    width: 44px;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
  }
  .transport-line { width: 1px; background: var(--border); }
  .transport-text {
    font-size: 12px;
    color: var(--muted);
    padding: 6px 0 6px 0;
    font-style: italic;
    flex: 1;
    display: flex;
    align-items: center;
  }

  /* EAT CARDS */
  .eat-card {
    background: var(--surface);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
  }

  .eat-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .eat-meal-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(232,201,126,0.12);
    color: var(--accent2);
    flex-shrink: 0;
  }

  .eat-name {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 2px;
  }

  .eat-type {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .eat-desc {
    font-size: 13px;
    color: #bbb;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .order-box {
    background: var(--surface2);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-left: 2px solid var(--accent);
  }
  .order-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 4px;
  }
  .order-text {
    font-size: 12px;
    color: #ccc;
    line-height: 1.5;
  }

  /* CAFE CARDS */
  .cafe-card {
    background: var(--surface);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-top: 2px solid rgba(91,155,213,0.4);
  }

  .cafe-time-badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--seoul);
    margin-bottom: 4px;
  }

  .cafe-name {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.2px;
    margin-bottom: 2px;
  }

  .cafe-type {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .cafe-desc {
    font-size: 13px;
    color: #bbb;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .cafe-order {
    background: var(--surface2);
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 8px;
    border-left: 2px solid var(--seoul);
  }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(15,15,15,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 8px 16px calc(var(--safe-bottom) + 8px);
    display: flex;
    gap: 6px;
    justify-content: center;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .bottom-nav::-webkit-scrollbar { display: none; }

  .nav-dot {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .nav-dot.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .nav-dot.seoul-city { border-color: rgba(91,155,213,0.4); }
  .nav-dot.busan-city { border-color: rgba(224,123,90,0.4); }

  /* STOP TYPE PILLS */
  .stop-type-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
    margin-bottom: 5px;
  }
  .stop-pill-food { background: rgba(180,120,200,0.15); color: #c8a0d8; }
  .stop-pill-cafe { background: rgba(91,155,213,0.15); color: #8ab8e0; }
  .stop-pill-snack { background: rgba(106,191,123,0.15); color: #8ddb9e; }
  .stop-pill-place { background: rgba(140,140,140,0.12); color: #999; }

  /* STOP DOT COLORS */
  .stop-dot-food { background: #c8a0d8; }
  .stop-dot-cafe { background: #8ab8e0; }
  .stop-dot-snack { background: #8ddb9e; }
  .stop-dot-place { background: var(--accent); }

  /* STOP BODY LEFT BORDER */
  .stop-body-food { border-left: 2px solid rgba(180,120,200,0.3); }
  .stop-body-cafe { border-left: 2px solid rgba(91,155,213,0.3); }
  .stop-body-snack { border-left: 2px solid rgba(106,191,123,0.3); }

  /* STOP HOURS */
  .stop-hours {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.2px;
  }

  /* NAV ROW */
  .nav-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }

  .nav-to-next {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
    justify-content: flex-end;
  }

  .nav-item {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }
  .nav-item.walk { background: rgba(106,191,123,0.12); color: #8ddb9e; }
  .nav-item.uber { background: rgba(232,201,126,0.12); color: var(--accent2); }

  /* TLDR BOX */
  .tldr-box {
    background: rgba(91,155,213,0.08);
    border-radius: var(--border-radius-md);
    border-left: 3px solid var(--seoul);
    padding: 10px 14px;
    margin-bottom: 14px;
  }
  .tldr-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--seoul);
    margin-bottom: 5px;
  }
  .tldr-text {
    font-size: 13px;
    color: var(--text);
    line-height: 1.6;
  }

  /* ETIQUETTE BOX */
  .etiquette-box {
    background: rgba(232,201,126,0.06);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    border-left: 2px solid rgba(232,201,126,0.4);
  }

  /* DESSERT CARDS */
  .dessert-card {
    background: var(--surface);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-top: 2px solid rgba(180,120,200,0.5);
  }
  .dessert-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; color: #c8a0d8; }
  .dessert-type { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
  .dessert-desc { font-size: 12px; color: #bbb; line-height: 1.5; margin-bottom: 6px; }

  /* ALT CARDS */
  .alt-card {
    background: var(--surface);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    opacity: 0.85;
  }
  .alt-name { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .alt-type { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
  .alt-desc { font-size: 12px; color: #aaa; line-height: 1.5; margin-bottom: 6px; }

  /* ANIMATIONS */
  .day-view { animation: fadeUp 0.25s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="trip-title">🇰🇷 Korea</div>
    </div>
    <div class="trip-dates">Mar 25 – Apr 2 · 9 Days</div>
  </div>
  <div class="city-filter">
    <button class="city-btn active-all" onclick="filterCity('all', this)">All</button>
    <button class="city-btn" onclick="filterCity('seoul', this)">Seoul</button>
    <button class="city-btn" onclick="filterCity('busan', this)">Busan</button>
  </div>
  <div class="day-scroll" id="dayScroll"></div>
</div>

<div class="content" id="content"></div>

<div class="bottom-nav" id="bottomNav"></div>

<script>
const DAYS = [{"id": 1, "date": "Mar 25", "dow": "Wed", "city": "Seoul", "title": "Arrival + Myeongdong", "subtitle": "Late arrival day. Land at 17:40 at Terminal 2 — by the time you clear customs and reach Myeongdong it will be around 7:30-8pm. Easy first night.", "alerts": [{"type": "tip", "text": "✈️ Terminal 2 arrival. AREX Express train from T2 to City Hall ~51 min (9,500 won) — runs until late. Buy T-money card and SIM at the arrivals hall before the train."}, {"type": "tip", "text": "🕐 Realistically at your hotel by 7:30-8pm. Skip the tower tonight — save it for another evening. Just eat, walk Myeongdong, and rest."}], "bookings": [{"text": "✅ e-Arrival Card — Issue No: EAC-26-PA-07792299 · Show on phone at immigration", "link": "https://www.e-arrivalcard.go.kr", "label": "View"}], "stops": [{"time": "17:40", "name": "Land at Incheon Terminal 2", "type": "Arrival", "desc": "Clear immigration and customs (~45-60 min). Pick up your SIM card and T-money card at the arrivals hall before heading to the train — booths are right there.", "tags": [{"t": "Buy T-money card here", "c": "tip"}, {"t": "Buy SIM card here", "c": "tip"}, {"t": "KT or SKT booths", "c": "tip"}], "map": "https://maps.google.com/?q=Incheon+Airport+Terminal+2"}, {"transport": "AREX Express from T2 to City Hall — 51 min, 9,500 won. Runs every 30 min."}, {"time": "~19:30", "name": "L'Escape Myeongdong", "type": "Hotel · Check In", "desc": "Check in, drop everything, freshen up. You have made it. The hotel is walking distance from dinner and the Myeongdong street food strip.", "tags": [{"t": "Ask concierge for tips", "c": "tip"}], "map": "https://maps.google.com/?q=L+Escape+Hotel+Myeongdong+Seoul"}, {"time": "~20:00", "name": "Myeongdong Evening Wander", "type": "Street Food + First Impressions", "desc": "Walk the main strip after dinner. Touristy but genuinely fun energy on a first night in Seoul. The neon, the vendors, the smell of tteokbokki — this is your welcome to Korea.", "tags": [{"t": "Open ", "map": "https://maps.google.com/?q=Cafe+Bora+Insadong+Seoul"}], "timeline": [{"time": "17:40", "name": "Land at Incheon Terminal 2", "type": "Arrival", "stopType": "place", "desc": "Clear immigration and customs (~45-60 min). Grab your SIM and T-money card at the arrivals hall — booths are right there before the train.", "hours": "Airport 24hrs", "tags": [{"t": "Buy T-money card here", "c": "tip"}, {"t": "Buy SIM card here", "c": "tip"}, {"t": "KT or SKT booths", "c": "tip"}], "map": "https://maps.google.com/?q=Incheon+Airport+Terminal+2"}, {"transport": "🚆 AREX Express T2 → City Hall — 51 min, ₩9,500. Runs every 30 min."}, {"time": "Optional", "name": "Namdaemun Market Hotteok", "type": "10 min from hotel · Famous Japchae Hotteok Stall", "stopType": "snack", "desc": "If you arrive early enough and have energy — the most famous hotteok stall in Seoul is a 10-min walk from your hotel. Savory japchae glass noodle filling is the viral one. Quick queue, standing food.", "order": "Japchae hotteok (savory) + sweet seed hotteok (brown sugar). One of each. Add soy sauce for ₩1,000 extra. ₩1,500–2,500 each.", "hours": "8:30am–6:30pm, closed Sundays", "tags": [{"t": "₩1,500-2,500 each", "c": "food"}, {"t": "Closed Sundays", "c": "warn"}, {"t": "Cash preferred", "c": "warn"}, {"t": "Optional on arrival day", "c": "tip"}], "map": "https://maps.google.com/?q=Namdaemun+Vegetable+Hotteok+Seoul", "etiquette": "Stand in line, point and hold up fingers for quantity. Cash. Eat standing — no seats."}, {"time": "~19:30", "name": "L'Escape Hotel — Check In", "type": "Hotel", "stopType": "place", "desc": "Drop everything, freshen up. You've made it.", "hours": "Check-in from 3pm", "walk_next": "15 min walk to dinner", "uber_next": "₩3,000 / 3 min", "tags": [{"t": "Ask concierge for tips", "c": "tip"}], "map": "https://maps.google.com/?q=L+Escape+Hotel+Myeongdong+Seoul"}, {"time": "~20:00", "name": "Tosokchon Samgyetang", "type": "Ginseng Whole Chicken Soup · Michelin Recommended", "stopType": "food", "desc": "One of Seoul's most iconic restaurants — a whole young chicken stuffed with glutinous rice, ginseng, garlic, and jujube in rich broth. Packed with Korean families. They give you a shot of ginseng liquor with it.", "order": "Samgyetang — that's the whole menu. Add pajeon if hungry. No spice, clean healing broth. Season with the salt provided.", "hours": "Open until 10pm daily", "walk_next": "15 min walk back through Myeongdong strip", "uber_next": "₩3,000 / 3 min", "tags": [{"t": "Chicken", "c": "food"}, {"t": "No reservation", "c": "tip"}, {"t": "~17,000 won", "c": "food"}, {"t": "Closes 10pm", "c": "warn"}], "map": "https://maps.google.com/?q=Tosokchon+Samgyetang+Seoul", "alts": ["Any samgyetang restaurant near Gyeongbokgung — the area is full of them"], "etiquette": "Walk in and wait at entrance — staff seat you. Order by pointing at the menu or saying 삼계탕 (samgyetang). Call server with 저기요 (jeogiyo). Pay at counter when leaving. No tipping ever in Korea."}, {"time": "~21:30", "name": "Myeongdong Street Food Wander", "type": "Late Night Snacks · Outside Your Hotel", "stopType": "snack", "desc": "Walk back through the strip after dinner. Touristy but genuinely fun energy on a first night. The neon, vendors, smell of tteokbokki — your welcome to Korea.", "order": "Hotteok (sweet brown sugar pancake) or tornado potato. Both under ₩4,000.", "hours": "Stalls open until midnight+", "walk_next": "2 min to hotel", "tags": [{"t": "2,000-4,000 won", "c": "food"}, {"t": "Open late", "c": "tip"}], "map": "https://maps.google.com/?q=Myeongdong+Street+Food+Seoul"}], "alternatives": [{"name": "Namdaemun Market Hotteok", "type": "10 min from hotel · Savory japchae + sweet seed versions", "desc": "If you have energy after arrival — or any morning before Day 4 (closed Sundays). The famous japchae-filled hotteok stall near Hoehyeon Station. Line 4 from Myeongdong or 10 min walk.", "map": "https://maps.google.com/?q=Namdaemun+Vegetable+Hotteok+Seoul"}, {"name": "Cafe Bora", "type": "Matcha Cafe · Save for Day 2", "desc": "Skip tonight — it's a 10am opener. Better as your morning coffee on Day 2 before the palaces.", "map": "https://maps.google.com/?q=Cafe+Bora+Insadong+Seoul"}, {"name": "Any Myeongdong ramen spot", "type": "If Tosokchon has a long queue", "desc": "The street has dozens of Korean ramen and noodle spots open late. No reservations, fast turnover.", "map": "https://maps.google.com/?q=Myeongdong+ramen+Seoul"}], "tldr": "Land at 5:40pm, AREX train to Myeongdong (~51 min), check in to L'Escape, walk 15 min to dinner at Tosokchon, stroll Myeongdong street food strip. Easy night — hotel is your base all evening."}, {"id": 2, "date": "Mar 26", "dow": "Thu", "city": "Seoul", "title": "Jongno — Palace Day", "subtitle": "The historical heart of Seoul. Both palaces in the morning, hanok alleys in the afternoon, and a classic market in the evening.", "alerts": [{"type": "tip", "text": "✅ Secret Garden booked — Chinese tour 12:30pm. Arrive at Changdeokgung gate by 12:15pm. Exchange your booking (Book No: 114856639) at the ticket office or KIOSK — bring your ID/passport."}, {"type": "warn", "text": "You still need to buy a separate Changdeokgung Palace entry ticket at the gate — ₩3,000. The ₩5,000 you paid is for the garden only."}, {"type": "tip", "text": "Gyeongbokgung closes Tuesdays — you're going Thursday, you're fine."}], "bookings": [{"text": "✅ Secret Garden — 12:30pm Chinese tour · Book No: 114856639 · Exchange at ticket office or KIOSK with ID · ₩5,000 paid · Arrive by 12:15pm", "link": "https://ticket.uforus.co.kr", "label": "View"}], "stops": [{"time": "9am", "name": "Gyeongbokgung Palace", "type": "Palace · 1395 · Guard Change at 10am", "desc": "Arrive at opening. Guard-changing ceremony at the main gate at 10am sharp — free to watch. Rent a hanbok (~20,000 won/hr) for free entry. Keep it to ~1 hour so you can get to Changdeokgung in time for the 11:30am garden slot.", "tags": [{"t": "Entry 3,000 won", "c": "ticket"}, {"t": "Hanbok = free entry", "c": "free"}, {"t": "9am-5pm", "c": "tip"}, {"t": "Keep visit to ~1hr", "c": "warn"}], "map": "https://maps.google.com/?q=Gyeongbokgung+Palace+Seoul"}, {"transport": "15 min walk or short taxi east to Changdeokgung"}, {"time": "11am", "name": "Changdeokgung + Secret Garden", "type": "UNESCO Palace · Book Garden Slot Ahead", "desc": "Buy the palace ticket at the gate (3,000 won), then use your pre-booked Secret Garden slot for the 11:30am English tour. The garden is a forested royal retreat with pavilions and ponds — one of the most beautiful places in Seoul. Book the garden slot at royal.cha.go.kr before your trip. Tours at 10am, 11:30am, 2pm, 3:30pm in English.", "tags": [{"t": "Palace 3,000 won at gate", "c": "ticket"}, {"t": "Garden 5,000 won — book online", "c": "ticket"}, {"t": "Closed Mondays", "c": "warn"}, {"t": "Last English tour 3:30pm", "c": "warn"}, {"t": "Book at royal.cha.go.kr", "c": "warn"}], "map": "https://maps.google.com/?q=Changdeokgung+Palace+Seoul"}, {"transport": "5 min walk south"}, {"time": "1:30pm", "name": "Bukchon Hanok Village", "type": "Traditional Neighborhood", "desc": "Go early afternoon before the last tourist rush. Best shot: top of Bukchon-ro 11-gil for the iconic rooftop view. People live here — keep noise down.", "tags": [{"t": "Free", "c": "free"}, {"t": "Quieter after 1pm", "c": "tip"}], "map": "https://maps.google.com/?q=Bukchon+Hanok+Village+Seoul"}, {"transport": "5 min walk south to Insadong"}, {"time": "2:30pm", "name": "Insadong + Ikseon-dong", "type": "Cultural Streets · Afternoon Wander", "desc": "Traditional street followed by the hip hanok alley with indie cafes and boutiques. Plenty of time to browse slowly.", "tags": [{"t": "Free to explore", "c": "free"}, {"t": "Shops 10am-9pm", "c": "tip"}], "map": "https://maps.google.com/?q=Ikseon-dong+Seoul"}, {"transport": "10 min walk or taxi to Gwangjang Market"}, {"time": "5pm", "name": "Gwangjang Market", "type": "Seoul's Oldest Market · 1905 · Netflix Famous", "desc": "One of Seoul's most iconic traditional markets — the Netflix Street Food episode was filmed here. Go in the early evening when the food stalls are fully alive. Sit at a counter, let the grandmas cook, and eat elbow-to-elbow with locals. The vibe is completely unlike any tourist food hall.", "tags": [{"t": "Free entry", "c": "free"}, {"t": "Open until 10pm+", "c": "tip"}, {"t": "Cash preferred", "c": "warn"}, {"t": "Michelin Bib nearby: Buchon Yukhoe", "c": "ticket"}], "map": "https://maps.google.com/?q=Gwangjang+Market+Seoul"}], "eats": [{"meal": "Lunch", "name": "Myeongdong Kyoja", "type": "Michelin Bib Gourmand · Kalguksu + Mandu · Myeongdong", "desc": "One of Seoul's most beloved noodle institutions, open since 1966. Michelin Bib Gourmand. Four items on the menu total — kalguksu (handcut noodle soup), bibimguksu (spicy mixed noodles), mandu (dumplings), and kongguksu in summer. Fast, affordable, packed with locals. The garlic-heavy kimchi is made in-house and exceptional. Slight detour from Jongno but only 15 min on subway.", "order": "Kalguksu (handcut noodle soup, light anchovy broth) + mandu (dumplings, pork/kimchi). Ask for 매운 거 주세요 (spicy version) if you want heat. Both under ₩12,000 each.", "tags": [{"t": "Michelin Bib Gourmand", "c": "ticket"}, {"t": "Noodles + dumplings", "c": "food"}, {"t": "No reservation", "c": "tip"}, {"t": "~10,000-12,000 won", "c": "food"}, {"t": "Open since 1966", "c": "tip"}], "map": "https://maps.google.com/?q=Myeongdong+Kyoja+Seoul"}, {"meal": "Lunch", "name": "Kkangtong Mandu", "type": "Dumpling Soup · Near Bukchon", "desc": "A locally beloved dumpling restaurant steps from Bukchon Hanok Village. The dumpling soup is legendary — thick broth, fat dumplings, incredibly comforting. Lines form but they move fast. Arrive right at 12pm.", "order": "Mandu guk (dumpling soup) — the whole reason to come. Add a pajeon if you want something crispy on the side.", "tags": [{"t": "No reservation — arrive early", "c": "tip"}, {"t": "~10,000-13,000 won", "c": "food"}, {"t": "Near Bukchon", "c": "tip"}], "map": "https://maps.google.com/?q=Kkangtong+Mandu+Seoul+Bukchon"}, {"meal": "Dinner", "name": "Oreno Ramen", "type": "Michelin Bib Gourmand · Chicken Ramen · Insadong branch", "desc": "The best chicken ramen in Seoul by a wide margin. Michelin-recognized. The broth is a creamy chicken paitan — blended to a froth right before serving, nutty and rich. Free refills of noodles and rice. Locals queue for this and it is absolutely worth it.", "order": "Kara Paitan — the spicy version of the creamy chicken broth. That is the one. Add a soft-boiled egg. Ask for extra chili peppers (free). Noodle refills are free.", "tags": [{"t": "Chicken ramen", "c": "food"}, {"t": "Spicy option", "c": "food"}, {"t": "Michelin Bib Gourmand", "c": "tip"}, {"t": "No reservation — queue", "c": "tip"}, {"t": "~11,000 won", "c": "food"}], "map": "https://maps.google.com/?q=Oreno+Ramen+Insadong+Seoul"}, {"meal": "Evening snacks", "name": "Gwangjang Market Stalls", "type": "Traditional Market Food · Jongno", "desc": "The Netflix market. The handcut noodle grandmas are the main draw — sit at any kalguksu stall for spicy broth noodles. The mandu (dumplings) here are pan-fried and exceptional. Wash it down with makgeolli (milky rice wine poured from a metal kettle) which is ₩3,000 a bowl.", "order": "Kalguksu (handcut noodles, ask 매운 거 for spicy) + gun mandu (pan-fried dumplings, pork or kimchi) + mayak gimbap (tiny addictive rice rolls, ₩3,000) + makgeolli rice wine. Total under ₩20,000.", "tags": [{"t": "Netflix featured", "c": "tip"}, {"t": "Noodles + dumplings", "c": "food"}, {"t": "₩3,000–10,000 per dish", "c": "food"}, {"t": "Cash preferred", "c": "warn"}, {"t": "Michelin Bib: Buchon Yukhoe stall", "c": "ticket"}], "map": "https://maps.google.com/?q=Gwangjang+Market+Seoul"}], "cafes": [{"time": "Morning coffee · 9am", "name": "Namusairo", "type": "Specialty Coffee · Renovated Hanok · Near Gyeongbokgung", "desc": "A beautifully restored hanok right by the palace — white walls, wood beams, a little attic nook, and genuinely excellent coffee. One of the best spots in the city for coffee inside traditional architecture. Get a window seat or the attic if it is free.", "order": "Flat white or filter coffee. They do a beautiful latte art. Pick up a pastry if they have any. Under 9,000 won.", "map": "https://maps.google.com/?q=Namusairo+cafe+Seoul+Gyeongbokgung"}, {"time": "Afternoon · 3pm", "name": "Cheongsudang Bakery", "type": "Garden Hanok Cafe · Ikseon-dong", "desc": "A stunning nature-themed cafe in Ikseon-dong — you enter over stepping stones with water flowing beneath you, and inside there are streams, fountains and lush greenery everywhere. Completely unique. Named after the Korean word for clear water, the whole design flows around it.", "order": "Any seasonal drink — matcha or ade. The desserts are beautiful but secondary to just sitting inside this space.", "map": "https://maps.google.com/?q=Cheongsudang+Bakery+Ikseon-dong+Seoul"}], "timeline": [{"time": "9am", "name": "Namusairo", "type": "Specialty Coffee · Renovated Hanok · Near Gyeongbokgung", "stopType": "cafe", "desc": "A beautifully restored hanok right by the palace — white walls, wood beams, attic nook, and genuinely excellent coffee. Get there before the palace opens.", "order": "Flat white or filter coffee + pastry if available. Under ₩9,000.", "hours": "Open 8am daily", "walk_next": "3 min walk to Gyeongbokgung gate", "map": "https://maps.google.com/?q=Namusairo+cafe+Seoul+Gyeongbokgung"}, {"time": "9:30am", "name": "Gyeongbokgung Palace", "type": "Palace · 1395 · Guard Change 10am", "stopType": "place", "desc": "Arrive early, watch the guard change ceremony at 10am — free and unmissable. Rent a hanbok (~₩20,000/hr) for free entry. Keep visit to ~1hr to make the 11:30am Secret Garden slot.", "hours": "9am–5pm, closed Tuesdays", "walk_next": "15 min walk east", "uber_next": "₩4,000 / 5 mi "Dumplings", "c": "food"}, {"t": "~12,000-15,000 won", "c": "food"}, {"t": "No reservation weekends", "c": "tip"}, {"t": "Can sell out — go at lunch", "c": "warn"}], "map": "https://maps.google.com/?q=Gaeseong+Mandu+Koong+Insadong+Seoul", "alts": ["Myeongdong Kyoja — if Koong is full, 15 min walk to Myeongdong, same Michelin Bib tier, kalguksu + mandu"], "etiquette": "Wait at entrance — staff seat you. Order from menu (photos available). Say 저기요 to call server. Pay at counter when leaving. No tipping."}, {"time": "2pm", "name": "Bukchon Hanok Village", "type": "Traditional Neighborhood · Best Photo Spot", "stopType": "place", "desc": "Top of Bukchon-ro 11-gil for the iconic rooftop view over tiled hanok roofs. Go early afternoon before the last rush. People live here — keep it quiet.", "hours": "Always open (residential area)", "walk_next": "5 min walk south to Insadong", "tags": [{"t": "Free", "c": "free"}, {"t": "Quieter after 1pm", "c": "tip"}], "map": "https://maps.google.com/?q=Bukchon+Hanok+Village+Seoul"}, {"time": "3pm", "name": "Cheongsudang Bakery", "type": "Garden Hanok Cafe · Ikseon-dong", "stopType": "cafe", "desc": "Enter over stepping stones with water flowing beneath, streams and fountains inside, lush greenery everywhere. One of the most unique cafe spaces in Seoul — completely immersive.", "order": "Any seasonal drink — matcha or ade. The space is the main event. Under ₩9,000.", "hours": "11am–9pm daily", "walk_next": "2 min walk to Insadong main street", "map": "https://maps.google.com/?q=Cheongsudang+Bakery+Ikseon-dong+Seoul"}, {"time": "3:30pm", "name": "Insadong + Ikseon-dong", "type": "Cultural Streets · Afternoon Wander", "stopType": "place", "desc": "Traditional street followed by the hip hanok alley with indie cafes and boutiques. Plenty of time to browse slowly.", "hours": "Shops 10am–9pm", "walk_next": "10 min walk to Gwangjang", "uber_next": "₩4,000 / 4 min", "tags": [{"t": "Free to explore", "c": "free"}], "map": "https://maps.google.com/?q=Ikseon-dong+Seoul"}, {"transport": "🚶 10 min walk north to Gwangjang Market"}, {"time": "5pm", "name": "Gwangjang Market", "type": "Seoul's Oldest Market · 1905 · Netflix Famous", "stopType": "food", "desc": "The Netflix Street Food market. Sit at a handcut noodle stall counter, eat elbow-to-elbow with locals, drink makgeolli poured from a metal kettle. Completely unlike any tourist food hall.", "order": "Kalguksu (handcut noodles, ask 매운 거 for spicy) + gun mandu (pan-fried dumplings) + mayak gimbap (tiny addictive rice rolls ₩3,000) + makgeolli rice wine. Total under ₩20,000.", "hours": "8am–11pm (food stalls peak 5pm–10pm)", "walk_next": "15 min walk or subway back to hotel", "tags": [{"t": "Netflix featured", "c": "tip"}, {"t": "₩3,000–10,000 per dish", "c": "food"}, {"t": "Cash preferred", "c": "warn"}, {"t": "Michelin Bib: Buchon Yukhoe stall", "c": "ticket"}], "map": "https://maps.google.com/?q=Gwangjang+Market+Seoul"}, {"time": "7:30pm", "name": "Oreno Ramen", "type": "Michelin Bib Gourmand · Creamy Chicken Ramen · Insadong", "stopType": "food", "desc": "The best chicken ramen in Seoul. Michelin-recognized. Creamy chicken paitan broth blended to a froth — nutty and rich. Free noodle refills. Locals queue and it's worth it.", "order": "Kara Paitan — the spicy creamy chicken version. Add a soft-boiled egg. Ask for extra chili (free). Noodle refills are free.", "hours": "11:30am–10pm, closed Sundays", "walk_next": "15 min walk to hotel", "uber_next": "₩4,000 / 4 min", "tags": [{"t": "Michelin Bib Gourmand", "c": "ticket"}, {"t": "Spicy option", "c": "food"}, {"t": "~11,000 won", "c": "food"}, {"t": "No reservation", "c": "tip"}], "map": "https://maps.google.com/?q=Oreno+Ramen+Insadong+Seoul", "alts": ["Menten Ramen (Michelin Bib) — tantanmen spicy peanut broth, near Myeongdong hotel"], "etiquette": "Order at the counter or kiosk when you arrive, pay first, then find a seat. Solo counter seating available. No reservation needed — just queue outside if full."}, {"transport": "🚶 15 min walk or ₩5,000 taxi to Haebangchon"}, {"time": "Evening (optional)", "name": "Haebangchon (HBC)", "type": "Jazz Bars · Indie Cafes · Uphill Alleys · Near Namsan", "stopType": "place", "desc": "One of Seoul's most beloved neighbourhood gems — a steep hillside village near Namsan Tower with jazz bars, tiny indie cafes, street art, and a genuinely local vibe. Far less touristy than Insadong or Hongdae. Best in the evening when the bars and jazz venues come alive. If you have energy after Gwangjang, this is a great wind-down.", "hours": "Neighbourhood always open. Bars from 7pm, jazz venues from 8pm.", "walk_next": "10 min walk to Namsan Tower if you want the night view", "uber_next": "₩5,000 / 7 min back to hotel", "tags": [{"t": "Jazz bars from 8pm", "c": "tip"}, {"t": "Very local vibe", "c": "tip"}, {"t": "Uphill walk", "c": "warn"}, {"t": "Free to explore", "c": "free"}], "map": "https://maps.google.com/?q=Haebangchon+Seoul", "etiquette": "Walk in to any bar or cafe — no reservations needed. Jazz venues usually have a small cover charge or minimum drink order. Just sit wherever there's space."}], "alternatives": [{"name": "Myeongdong Kyoja", "type": "Michelin Bib Gourmand · Kalguksu + Mandu · Since 1966", "desc": "If Gaeseong Mandu Koong is full or sold out — 15 min walk to Myeongdong. Handcut noodle soup + dumplings, open since 1966. Just as good, different style.", "map": "https://maps.google.com/?q=Myeongdong+Kyoja+Seoul"}, {"name": "Kkangtong Mandu", "type": "Dumpling Soup · Near Bukchon", "desc": "Locally beloved alternative lunch to Myeongdong Kyoja. Thick broth, fat dumplings. Arrive at noon, line moves fast.", "map": "https://maps.google.com/?q=Kkangtong+Mandu+Seoul+Bukchon"}, {"name": "Menten Ramen", "type": "Michelin Bib · Tantanmen · Near Hotel", "desc": "If Oreno has too long a queue — spicy peanut broth tantanmen, only 10 seats, near Myeongdong. Same Michelin tier.", "map": "https://maps.google.com/?q=Menten+Ramen+Myeongdong+Seoul"}, {"name": "Cafe Bora", "type": "Matcha Soft Serve · Insadong", "desc": "If you want a sweet afternoon stop — deep blue matcha soft serve, photographed cafe. On your Insadong route.", "map": "https://maps.google.com/?q=Cafe+Bora+Insadong+Seoul"}], "tldr": "Full day in the Jongno/palace district — all walkable from each other. Morning coffee near Gyeongbokgung → both palaces → Secret Garden tour at 12:30pm (booked ✓) → Bukchon rooftop shot → Insadong/Ikseon alleys → Gwangjang Market for dinner. You won't need to go back to the hotel until the end of the night. ~30 min taxi home."}, {"id": 3, "date": "Mar 27", "dow": "Fri", "city": "Seoul", "title": "Day Trip — Jeonju", "subtitle": "2 hrs south by KTX. 700+ hanok houses, the original bibimbap, and great street food.", "alerts": [{"type": "warn", "text": "🚆 KTX 503 departs Seoul Station 07:03 — be at the station by 6:40am. Car 15, Seat 6D. Platform released 15 min before departure."}, {"type": "warn", "text": "🚆 S-train 2522 departs Jeonju 19:01 — be at Jeonju Station by 6:45pm. Car 3, Seat 12C. First Class. Arrives Seoul 22:15."}, {"type": "tip", "text": "You have 9am–7pm in Jeonju — a full day. Taxi from Jeonju Station to Hanok Village ~₩5,000 (15 min)."}], "bookings": [{"text": "✅ KTX 503 · Seoul 07:03 → Jeonju 08:54 · Car 15 · Seat 6D · Ticket: 80006-0323-10016-42", "link": "https://www.letskorail.com", "label": "View"}, {"text": "✅ S-train 2522 · Jeonju 19:01 → Seoul 22:15 · Car 3 · Seat 12C · First Class · Ticket: 80039-0324-10021-12", "link": "https://www.letskorail.com", "label": "View"}], "stops": [{"time": "7:30am", "name": "Seoul Station — Depart KTX", "type": "High Speed Train · ~2hrs", "desc": "Arrive Jeonju ~10am. Buy snacks in the station convenience store for the ride.", "tags": [{"t": "~28,000 won each way", "c": "ticket"}, {"t": "Book in advance", "c": "warn"}], "map": "https://maps.google.com/?q=Seoul+Station"}, {"time": "10am-5pm", "name": "Jeonju Hanok Village", "type": "700+ Hanok Houses · All Day", "desc": "Over 700 traditional houses. Rent a hanbok (~15,000 won/hr, hair styling included), walk the Gyodong alleys, visit Pungnamnu Gate. The most intact traditional village in Korea.", "tags": [{"t": "Free to walk", "c": "free"}, {"t": "Hanbok ~15,000 won", "c": "ticket"}, {"t": "Open 24hrs", "c": "tip"}], "map": "https://maps.google.com/?q=Jeonju+Hanok+Village"}, {"time": "5:30pm", "name": "Jeonju Station — KTX Return", "type": "Back to Seoul · ~2hrs", "desc": "Arrive Seoul ~7:30pm. Easy evening back at the hotel.", "tags": [{"t": "~28,000 won", "c": "ticket"}], "map": "https://maps.google.com/?q=Jeonju+Station"}], "eats": [{"meal": "Lunch", "name": "Jeonju Bibimbap", "type": "The Original · Dolsot Stone Pot", "desc": "Jeonju is the birthplace of bibimbap. More vegetables, richer sesame oil, more banchan, and the stone pot gives crispy rice at the bottom. Walk into any restaurant with grandma-style staff out front.", "order": "Dolsot bibimbap. Mix immediately with gochujang. Scrape the crispy rice up last — that's the best part.", "tags": [{"t": "~10,000-14,000 won", "c": "food"}, {"t": "No reservation", "c": "tip"}, {"t": "The original", "c": "tip"}], "map": "https://maps.google.com/?q=Jeonju+Hanok+Village+bibimbap"}, {"meal": "Dinner", "name": "Kongnamul Gukbap", "type": "Bean Sprout Rice Soup · Jeonju Only", "desc": "Jeonju's other famous dish. A light, clean bean sprout rice soup — the ultimate local comfort food born in this city. Completely different from anything in Seoul. Perfect pre-train meal.", "order": "Kongnamul gukbap. Season with salt, add kimchi. Light and restorative. Under ₩10,000.", "tags": [{"t": "Jeonju specialty", "c": "tip"}, {"t": "~8,000-10,000 won", "c": "food"}, {"t": "No reservation", "c": "tip"}], "map": "https://maps.google.com/?q=kongnamul+gukbap+Jeonju"}], "cafes": [{"time": "Morning · 10am", "name": "Hanok Village Tea House", "type": "Traditional Tea · Slow Morning", "desc": "Any small tea house in the alleys — look for ones pouring sikhye or omija from clay pots. Sit for 30 min, take it all in.", "order": "Omija cha (five-flavor tea) + rice cake. ₩5,000–8,000.", "map": "https://maps.google.com/?q=Jeonju+Hanok+Village+tea+house"}, {"time": "Afternoon · 4:30pm", "name": "Any hanok cafe on the main alley", "type": "Injeolmi Bingsu + Grain Lattes", "desc": "Walk until something catches your eye. Quality is remarkably high even in tourist-facing spots here. Rest your feet before the train.", "order": "Injeolmi bingsu or barley latte. ₩7,000–12,000.", "map": "https://maps.google.com/?q=Jeonju+Hanok+Village+cafe"}], "timeline": [{"time": "7am", "name": "Seoul Station — KTX 503 Departs", "type": "Car 15 · Seat 6D · Departs 07:03", "stopType": "place", "desc": "Be at Seoul Station by 6:40am. Grab a triangle kimbap or coffee at the GS25 inside before boarding. Arrives Jeonju 08:54.", "hours": "Departs 07:03 sharp", "tags": [{"t": "BOOKED ✓", "c": "free"}, {"t": "Car 15 · Seat 6D", "c": "tip"}, {"t": "Arrive station by 6:40am", "c": "warn"}], "map": "https://maps.google.com/?q=Seoul+Station"}, {"transport": "🚆 KTX 503 — 1hr 51min ride · Arrive Jeonju 08:54 · Taxi to Hanok Village ~₩5,000, 15 min"}, {"time": "9am", "name": "Jeonju Hanok Village — Morning Explore", "type": "700+ Hanok Houses · Rent a Hanbok", "stopType": "place", "desc": "Arrive early before the crowds. The morning light on the rooftops is incredible for photos. Rent a hanbok first thing (~₩15,000/hr, hair styling included) and walk the Gyodong alleys. Visit Pungnamnu Gate. The village is most photogenic and peaceful before 11am.", "hours": "Village always open. Hanbok rentals from 9am.", "walk_next": "Wander the village", "tags": [{"t": "Free to walk", "c": "free"}, {"t": "Hanbok ~15,000 won", "c": "ticket"}, {"t": "Best light before 11am", "c": "tip"}], "map": "https://maps.google.com/?q=Jeonju+Hanok+Village"}, {"time": "10am", "name": "Hanok Village Tea House", "type": "Traditional Tea · Slow Morning", "stopType": "cafe", "desc": "Walk into any small traditional tea house tucked in the alleys. Look for ones pouring sikhye (sweet rice tea) or omija (five-flavor berry tea) from clay pots. Sit for 30 min, slow down, take it in.", "order": "Omija cha (five-flavor tea) or yuzu tea in ceramic cups + rice cake. ₩5,000–8,000.", "hours": "Most open 9am–7pm", "walk_next": "2 min walk to lunch spots", "map": "https://maps.google.com/?q=Jeonju+Hanok+Village+tea+house"}, {"time": "11am", "name": "Jeonju Bibimbap Lunch", "type": "The Original · Dolsot Stone Pot", "stopType": "food", "desc": "Jeonju is the birthplace of bibimbap — and it genuinely tastes different here. More vegetables, richer sesame oil, more banchan, and the stone pot gives you crispy rice at the bottom. Walk into any restaurant on the main village streets with grandma-style staff out front.", "order": "Dolsot bibimbap (stone pot). Mix everything with the gochujang paste immediately. The crispy rice at the bottom is the best part — scrape it up last.", "hours": "Most open 10am–8pm", "walk_next": "Walk the village streets", "tags": [{"t": "~10,000-14,000 won", "c": "food"}, {"t": "No reservation", "c": "tip"}, {"t": "The original", "c": "tip"}], "map": "https://maps.google.com/?q=Jeonju+Hanok+Village+bibimbap", "etiquette": "Walk in, sit anywhere, point at 돌솥비빔밥 on the menu. Mix immediately when it arrives or rice sticks to the hot pot."}, {"time": "12:30pm", "name": "Jeonju Street Food Crawl", "type": "Village Stalls · Walk and Eat", "stopType": "snack", "desc": "Jeonju is as famous for its street food as its village. Walk the main stall alley and try everything.", "order": "Choco pie (the original), hotteok with brown sugar, gamja hotdog (potato-coated corn dog), and the local specialty — injeolmi bingsu (shaved ice with rice cake). All ₩1,000–5,000.", "hours": "Stalls open ~10am until evening", "walk_next": "Walk to craft shops", "tags": [{"t": "₩1,000-5,000 each", "c": "food"}, {"t": "Walk and eat", "c": "tip"}], "map": "https://maps.google.com/?q=Jeonju+Hanok+Village+street+food"}, {"time": "1:30pm", "name": "Craft Shops + Hanji Paper District", "type": "Traditional Korean Crafts · Unique Souvenirs", "stopType": "place", "desc": "Jeonju is famous for hanji — traditional Korean mulberry paper — and the craft shops here are unlike anything in Seoul. Browse handmade fans, ceramics, calligraphy sets, and paper goods. Much cheaper and more authentic than Seoul souvenir shops. Great place to pick up gifts.", "hours": "Most open 10am–6pm", "walk_next": "10 min walk to Omokdae hill", "tags": [{"t": "Unique to Jeonju", "c": "tip"}, {"t": "Good for gifts", "c": "tip"}], "map": "https://maps.google.com/?q=Jeonju+Hanji+craft+shops"}, {"time": "2:30pm", "name": "Omokdae Hill Viewpoint", "type": "Best Panoramic View of the Village", "stopType": "place", "desc": "A short uphill walk to the best panoramic view of the entire Jeonju Hanok Village — 700+ tiled rooftops spread out below you against the mountains. One of the best photo spots in all of Korea. Completely free, rarely crowded, takes about 20 min round trip.", "hours": "Always open", "walk_next": "10 min walk down to Jeondong Cathedral", "tags": [{"t": "Free", "c": "free"}, {"t": "Best village view", "c": "tip"}, {"t": "Short uphill walk", "c": "warn"}], "map": "https://maps.google.com/?q=Omokdae+Jeonju"}, {"time": "3:15pm", "name": "Jeondong Cathedral + Gyeonggijeon Shrine", "type": "Gothic Cathedral + Royal Portrait Hall", "stopType": "place", "desc": "Two very different but beautiful buildings right next to each other. Jeondong Cathedral is a stunning red-brick Gothic cathedral built in 1914 — looks completely out of place next to the hanok village and that's what makes it incredible for photos. Gyeonggijeon Shrine next door houses the royal portrait of King Taejo and feels genuinely ancient inside.", "hours": "Cathedral always open. Gyeonggijeon 9am–6pm, ₩3,000", "walk_next": "5 min walk to cafe strip", "tags": [{"t": "Cathedral free", "c": "free"}, {"t": "Gyeonggijeon ₩3,000", "c": "ticket"}, {"t": "Great photo contrast", "c": "tip"}], "map": "https://maps.google.com/?q=Jeondong+Catholic+Church+Jeonju"}, {"time": "4:30pm", "name": "Afternoon Cafe + Bingsu", "type": "Hanok Cafe · Village Main Alley", "stopType": "cafe", "desc": "By afternoon the village fills with cafes doing injeolmi bingsu (shaved ice with toasted rice flour) and sweet grain lattes. Walk until something catches your eye — quality is remarkably high. Good place to rest your feet before the evening train.", "order": "Injeolmi bingsu or barley latte (boricha latte). Sweet, filling, very Korean. ₩7,000–12,000.", "hours": "Most open 10am–8pm", "walk_next": "Slow walk back toward station area", "map": "https://maps.google.com/?q=Jeonju+Hanok+Village+cafe"}, {"time": "5:30pm", "name": "Kongnamul Gukbap — Dinner", "type": "Bean Sprout Rice Soup · Jeonju Specialty", "stopType": "food", "desc": "Jeonju's other famous dish that you can't get like this elsewhere. Kongnamul gukbap is a light, clean bean sprout rice soup — the ultimate local comfort food. Born in Jeonju and completely different from anything in Seoul. Perfect pre-train dinner.", "order": "Kongnamul gukbap — the whole reason to come. Season with salt and add kimchi. Light, restorative, very local. Under ₩10,000.", "hours": "Most open until 8pm", "walk_next": "Taxi to Jeonju Station — 15 min", "uber_next": "₩5,000 taxi", "tags": [{"t": "Jeonju specialty", "c": "tip"}, {"t": "~8,000-10,000 won", "c": "food"}, {"t": "No reservation", "c": "tip"}], "map": "https://maps.google.com/?q=kongnamul+gukbap+Jeonju", "etiquette": "Walk in, sit down, point at 콩나물국밥 on menu. Simple one-bowl meal. Pay when leaving."}, {"transport": "🚕 Taxi to Jeonju Station — ~₩5,000, 15 min. Be there by 6:45pm"}, {"time": "7pm", "name": "Jeonju Station — S-train 2522 Departs", "type": "Car 3 · Seat 12C · First Class · Departs 19:01", "stopType": "place", "desc": "Be at Jeonju Station by 6:45pm. Board S-train 2522, Car 3, Seat 12C — First Class. Arrives Seoul 22:15. Enjoy the ride — you've earned it.", "hours": "Departs 19:01 sharp", "tags": [{"t": "BOOKED ✓", "c": "free"}, {"t": "Car 3 · Seat 12C", "c": "tip"}, {"t": "First Class", "c": "tip"}, {"t": "Arrives Seoul 22:15", "c": "tip"}, {"t": "Be there by 6:45pm", "c": "warn"}], "map": "https://maps.google.com/?q=Jeonju+Station"}], "alternatives": [{"name": "Jeonju Traditional Wine Museum", "type": "Free · Inside the Village", "desc": "Small museum about makgeolli and Korean traditional alcohol. Free entry, interesting for 30–40 min if you need something to do indoors.", "map": "https://maps.google.com/?q=Jeonju+Traditional+Wine+Museum"}, {"name": "Nambu Traditional Market", "type": "Local Market · 5 min walk from village", "desc": "If you've seen enough hanoks — this is the real local market where Jeonju residents actually shop. Chaotic, cheap, very authentic. Great for snacking and people watching.", "map": "https://maps.google.com/?q=Nambu+Market+Jeonju"}, {"name": "Injeolmi Bingsu anywhere", "type": "If you need a sugar break", "desc": "Available at almost every cafe in the village. Chewy rice cake + shaved ice. Not too sweet, very local.", "map": "https://maps.google.com/?q=Jeonju+Hanok+Village+bingsu"}], "tldr": "Full day trip to Jeonju. KTX 07:03 from Seoul (Car 15, Seat 6D) → arrive 08:54 → taxi to Hanok Village → wander, eat bibimbap, rent hanbok, street food all day → back to Jeonju Station for 19:01 S-train return (Car 3, Seat 12C, First Class) → Seoul 22:15."}, {"id": 4, "date": "Mar 28", "dow": "Sat", "city": "Seoul", "title": "Seongsu-dong", "subtitle": "Seoul's coolest neighbourhood. Converted warehouses, indie Korean fashion, best cafe scene in the city. Even better on a Saturday — the pop-ups and street scene are fully buzzing.", "alerts": [{"type": "tip", "text": "Line 2 from City Hall to Seongsu Station (~20 min). Exit 3. Saturday = boutiques fully open and pop-up scene at its best."}], "bookings": [], "stops": [{"time": "8am", "name": "Cafe Onion Seongsu", "type": "Flagship Cafe · Converted Warehouse", "desc": "Go early before the crowds. Massive brutalist factory space. Order the salt butter croissant.", "tags": [{"t": "Opens 8am", "c": "tip"}, {"t": "Coffee ~7,000 won", "c": "food"}], "map": "https://maps.google.com/?q=Cafe+Onion+Seongsu+Seoul"}, {"time": "10am-2pm", "name": "Seongsu-dong Boutiques", "type": "Korean Streetwear + Pop-ups", "desc": "Ordinary People, Ader Error, Mmlg Studio. Check @seongsu_official on Instagram before going for current pop-up info.", "tags": [{"t": "Most open 11am", "c": "tip"}, {"t": "Korean streetwear", "c": "shop"}], "map": "https://maps.google.com/?q=Seongsu+dong+Seoul"}, {"transport": "Seoul Forest is a 10 min walk — cherry blossoms likely late March"}, {"time": "3pm", "name": "Seoul Forest", "type": "Park · Cherry Blossom Spot", "desc": "One of the best cherry blossom spots in the city in late March / early April. Free and massive.", "tags": [{"t": "Free", "c": "free"}, {"t": "Cherry blossoms likely", "c": "tip"}], "map": "https://maps.google.com/?q=Seoul+Forest+Park"}, {"transport": "Line 2: Seongsu to Euljiro 3-ga (~10 min)"}, {"time": "6-8pm", "name": "Dongdaemun Design Plaza", "type": "Architecture · Zaha Hadid · Evening", "desc": "Stunning after dark when lit up. Walk the exterior and the LED rose garden — all free.", "tags": [{"t": "Exterior FREE", "c": "free"}, {"t": "24hrs exterior", "c": "tip"}, {"t": "Exhibitions ~10,000 won", "c": "ticket"}], "map": "https://maps.google.com/?q=Dongdaemun+Design+Plaza+Seoul"}], "eats": [{"meal": "Lunch", "name": "Baeknyeon Tojong Samgyetang", "type": "Chicken Ginseng Soup · Bukchon Area", "desc": "A beloved, slightly less touristy alternative to Tosokchon. Same concept — whole chicken in ginseng broth — but this one near Bukchon has a devoted local following and slightly richer broth. The spicy garlic cloves served as a side dish are addictive.", "order": "Samgyetang (whole ginseng chicken soup). Season with the salt. Order the spicy garlic clove side dish. That is all you need.", "tags": [{"t": "Chicken", "c": "food"}, {"t": "~17,000 won", "c": "food"}, {"t": "No reservation", "c": "tip"}, {"t": "Near Bukchon", "c": "tip"}], "map": "https://maps.google.com/?q=Baeknyeon+Tojong+Samgyetang+Seoul"}, {"meal": "Dinner", "name": "Nishimuramen", "type": "Michelin Bib Gourmand 2025 · Japanese-French Ramen · Jung-gu", "desc": "Brand new 2025 Michelin Bib Gourmand — the Seoul branch of Fukuoka's famed Nishimuramen. Chef Takahito Nishimura blends Japanese ramen technique with French cooking, using laver oil, Cheongyang chili pepper, and white kimchi-style tsukemono. The standout: pot rice mixed with cheese and ramen broth like a risotto. Completely unique and very hard to get outside Japan. Near DDP — perfect cap to a Seongsu day.", "order": "Signature ramen (rich, layered broth with French-Korean twists) + pot rice with cheese and ramen broth (the must-order side). Under ₩20,000.", "tags": [{"t": "Michelin Bib Gourmand 2025", "c": "ticket"}, {"t": "New this year", "c": "tip"}, {"t": "Near DDP", "c": "tip"}, {"t": "No reservation", "c": "tip"}, {"t": "~15,000-20,000 won", "c": "food"}], "map": "https://maps.google.com/?q=Nishimuramen+Seoul"}], "cafes": [{"time": "Morning · 8am", "name": "Cafe Onion Seongsu", "type": "Flagship Brutalist Warehouse Cafe · Already in Schedule", "desc": "Already on your schedule as the first stop of the day — this IS your morning coffee. Arrive at 8am before the queues build.", "order": "Iced Americano or latte + salt butter croissant. The croissant here is exceptional.", "map": "https://maps.google.com/?q=Cafe+Onion+Seongsu+Seoul"}, {"time": "Afternoon · 2pm", "name": "Lowide", "type": "Minimal Scandinavian Cafe · Seongsu", "desc": "Scandinavian-minimal aesthetic, super popular with Seongsu locals, lots of natural light. Cheesecake, caramel custard cream tart, salt bread. The kind of place you settle into for an hour with good coffee and watch the neighborhood go by.", "order": "Filter coffee or flat white + caramel custard cream tart. One of the better pastry-coffee pairings in Seongsu.", "map": "https://maps.google.com/?q=Lowide+cafe+Seongsu+Seoul"}], "timeline": [{"time": "8am", "name": "Cafe Onion Seongsu", "type": "Flagship Brutalist Warehouse Cafe · Morning Coffee", "stopType": "cafe", "desc": "Massive converted factory space. Go early before the queues build — by 10am it's packed. The salt butter croissant is exceptional.", "order": "Iced Americano or latte + salt butter croissant. Under ₩14,000 total.", "hours": "8am–10pm daily", "walk_next": "On-site — already in Seongsu", "map": "https://maps.google.com/?q=Cafe+Onion+Seongsu+Seoul"}, {"time": "10am", "name": "Seongsu-dong Boutiques", "type": "Korean Streetwear + Pop-ups", "stopType": "place", "desc": "Ordinary People, Ader Error, Mmlg Studio. Check @seongsu_official on Instagram before going for current pop-up info.", "hours": "Most open 11am–8pm", "walk_next": "Walking neighborhood all day", "tags": [{"t": "Korean streetwear", "c": "shop"}, {"t": "Most open 11am", "c": "tip"}], "map": "https://maps.google.com/?q=Seongsu+dong+Seoul"}, {"time": "11:30am", "name": "Hanjungsun", "type": "Fresh Fruit Chapssaltteok · Korean Mochi · Seongsu", "stopType": "snack", "desc": "A tiny takeout-only storefront displayed like a jewelry shop — individually wrapped chapssaltteok (Korean mochi) stuffed with whole fresh fruit. Strawberry, honey gold pineapple, persimmon, Dubai chocolate. The moment you bite in, fresh fruit bursts into your mouth. Chewy rice on the outside, tart fruit inside — barely sweet and incredibly refreshing.", "order": "Fresh strawberry chapssaltteok (₩4,000) — the signature. Honey gold pineapple (₩4,000) is also exceptional. Get at least two — one is not enough. Packaged in hanji paper like a gift.", "hours": "11am–8pm daily", "walk_next": "2 min walk to Rettre", "tags": [{"t": "₩3,500-5,500 each", "c": "food"}, {"t": "Takeout only", "c": "tip"}, {"t": "Queue moves fast", "c": "tip"}, {"t": "Not too sweet", "c": "tip"}], "map": "https://maps.google.com/?q=Hanjungsun+Seongsu+Seoul", "etiquette": "Queue outside, point at which flavors you want, pay and go. Takeout only — eat while walking or find a step to sit on nearby.", "dessert": true}, {"time": "12pm", "name": "Rettre", "type": "Custom Perfume Experience · Seongsu · 1 Year Later Letter", "stopType": "place", "desc": "One of the most unique experiences in Seoul — you walk in, choose from 33+ fragrance notes, and blend your own custom perfume with help from staff. They also write you a letter that gets mailed to you exactly one year later, reminding you of the memory. The Seongsu branch is right next to Hanjungsun on Yeonmujang-gil. No perfume knowledge needed.", "hours": "10am–8pm daily. Reservation recommended — book at rettre.com", "walk_next": "5 min walk back to boutiques", "tags": [{"t": "Reservation recommended", "c": "warn"}, {"t": "Book rettre.com", "c": "warn"}, {"t": "~45,000-60,000 won", "c": "ticket"}, {"t": "Unique souvenir", "c": "tip"}], "map": "https://maps.google.com/?q=Rettre+Seongsu+Seoul", "etiquette": "Book ahead online. Staff speak basic English and guide you through the whole process. Very relaxed — just tell them what scents you gravitate toward (woody, floral, fresh, etc.) and they help from there."}, {"time": "12:30pm", "name": "Baeknyeon Tojong Samgyetang", "type": "Ginseng Chicken Soup · Local Favourite", "stopType": "food", "desc": "Slightly less touristy than Tosokchon. Same concept — whole chicken in ginseng broth — but this one near Bukchon has a devoted local following and slightly richer broth. The spicy garlic clove side dish is addictive.", "order": "Samgyetang. Season with the salt. Order the spicy garlic clove side dish. That's all you need.", "hours": "10am–9pm daily", "walk_next": "10 min walk back to Seongsu boutiques", "uber_next": "₩5,000 / 6 min", "tags": [{"t": "Chicken", "c": "food"}, {"t": "~17,000 won", "c": "food"}, {"t": "No reservation", "c": "tip"}], "map": "https://maps.google.com/?q=Baeknyeon+Tojong+Samgyetang+Seoul", "alts": ["Any samgyetang spot in Seongsu if you don't want to leave the neighborhood"], "etiquette": "Walk in, wait to be seated. Point at 삼계탕 on menu. Broth comes plain — season yourself with the salt on table. Call server with 저기요."}, {"time": "2pm", "name": "Lowide", "type": "Minimal Scandinavian Cafe · Seongsu", "stopType": "cafe", "desc": "Scandinavian-minimal aesthetic, super popular with Seongsu locals, lots of natural light. Cheesecake, caramel custard cream tart, salt bread. Settle in for an hour.", "order": "Filter coffee or flat white + caramel custard cream tart. One of the better pastry-coffee pairings in Seongsu.", "hours": "11am–9pm daily", "walk_next": "10 min walk to Seoul Forest", "uber_next": "₩4,000 / 4 min", "map": "https://maps.google.com/?q=Lowide+cafe+Seongsu+Seoul"}, {"time": "3pm", "name": "Seoul Forest", "type": "Park · Cherry Blossom Spot", "stopType": "place", "desc": "One of the best cherry blossom spots in the city in late March / early April. Free and massive.", "hours": "Open 24hrs", "walk_next": "Subway Line 2 to Euljiro 3-ga (~10 min)", "uber_next": "₩8,000 / 12 min", "tags": [{"t": "Free", "c": "free"}, {"t": "Cherry blossoms likely", "c": "tip"}], "map": "https://maps.google.com/?q=Seoul+Forest+Park"}, {"transport": "🚇 Line 2: Seongsu → Euljiro 3-ga (~10 min)"}, {"time": "6pm", "name": "Dongdaemun Design Plaza (DDP)", "type": "Architecture · Zaha Hadid · Evening", "stopType": "place", "desc": "Stunning after dark when lit up. Walk the exterior and the LED rose garden — all free. Great for photos.", "hours": "Exterior open 24hrs. Exhibitions ~10am–8pm", "walk_next": "5 min walk to dinner", "tags": [{"t": "Exterior FREE", "c": "free"}, {"t": "Best after dark", "c": "tip"}], "map": "https://maps.google.com/?q=Dongdaemun+Design+Plaza+Seoul"}, {"time": "7:30pm", "name": "Nishimuramen", "type": "Michelin Bib Gourmand 2025 · Japanese-French Ramen · Near DDP", "stopType": "food", "desc": "Brand new 2025 Michelin Bib Gourmand — the Seoul branch of Fukuoka's famous Nishimuramen. French cooking technique meets Japanese ramen using laver oil, Cheongyang chili, and white kimchi-style toppings. The pot rice with cheese and ramen broth (like risotto) is unmissable.", "order": "Signature ramen + pot rice with cheese and ramen broth (must-order side). Under ₩20,000.", "hours": "11:30am–10pm, closed Mondays", "walk_next": "15 min walk or subway back to hotel", "uber_next": "₩7,000 / 10 min", "tags": [{"t": "Michelin Bib Gourmand 2025", "c": "ticket"}, {"t": "New this year", "c": "tip"}, {"t": "No reservation", "c": "tip"}, {"t": "~15,000-20,000 won", "c": "food"}], "map": "https://maps.google.com/?q=Nishimuramen+Seoul", "alts": ["Jangin Dakgalbi Myeongdong — spicy chicken tableside near hotel if you prefer something more Korean"], "etiquette": "Order at counter or kiosk. Pay first. Solo counter seating available. Say 저기요 to get attention if needed."}], "alternatives": [{"name": "Jangin Dakgalbi", "type": "Spicy Stir-Fried Chicken · Near Hotel", "desc": "Gochujang marinated chicken stir-fried tableside with cheese pull finish. Near Myeongdong — good fallback dinner.", "map": "https://maps.google.com/?q=Jangin+Dakgalbi+Myeongdong+Seoul"}, {"name": "Cafe Bora", "type": "Matcha Cafe · Insadong", "desc": "If you didn't hit this on Day 2 — blue matcha soft serve, photographed hanok cafe interior.", "map": "https://maps.google.com/?q=Cafe+Bora+Insadong+Seoul"}], "desserts": [{"name": "Hanjungsun chapssaltteok", "type": "Fresh fruit mochi · Seongsu · ₩4,000", "desc": "The best not-too-sweet dessert in Seoul. Chewy rice outside, whole fresh strawberry or pineapple inside. Bursts in your mouth. Already on your Day 3 schedule.", "map": "https://maps.google.com/?q=Hanjungsun+Seongsu+Seoul"}, {"name": "Yakgwa", "type": "Traditional Korean honey cookie · Not too sweet · Chewy", "desc": "Deep-fried wheat + sesame cookie soaked in honey-ginger syrup. Flower-shaped, chewy, aromatic. Not cloyingly sweet — more like a refined honey biscuit. Pick up at Gwangjang Market stalls (Day 2 evening) or Golden Piece in Hannam-dong for the premium version.", "map": "https://maps.google.com/?q=Golden+Piece+yakgwa+Hannam+Seoul"}, {"name": "Kkwabaegi (Korean twisted donut)", "type": "Street donut · Cinnamon sugar · Chewy not greasy", "desc": "Twisted yeasted donut rolled in cinnamon sugar. Soft inside, slightly chewy — like a churro crossed with a brioche. Never greasy or too sweet. Find at street stalls or Old Ferry Donut (Seoul) for modern versions with cream fillings.", "map": "https://maps.google.com/?q=Old+Ferry+Donut+Seoul"}, {"name": "Injeolmi", "type": "Rice cake · Nutty soybean powder · Very mochi-like", "desc": "Chewy glutinous rice cake dusted in roasted soybean powder. Nutty, mild, not sweet at all. Closest thing to mochi in Korea. Get it fresh at Gwangjang Market or any traditional tea house in Insadong/Jeonju.", "map": "https://maps.google.com/?q=Gwangjang+Market+Seoul"}, {"name": "Injeolmi bingsu", "type": "Shaved milk ice · Least sweet bingsu version", "desc": "Finely shaved milk ice topped with chewy injeolmi rice cakes and soybean powder. The least sweet bingsu flavor — nutty, light, refreshing. Available at Sulbing locations everywhere in Seoul.", "map": "https://maps.google.com/?q=Sulbing+Seoul"}, {"name": "Chapssal donut", "type": "Glutinous rice donut · Chewy mochi-like · Street stall", "desc": "Fried donut made from glutinous rice flour — chewy and mochi-like unlike regular donuts. Filled with sweet red bean or plain sugar. Find at Namdaemun Market and street stalls near traditional markets.", "map": "https://maps.google.com/?q=Namdaemun+Market+Seoul"}], "tldr": "All day in Seongsu-dong on the east side of Seoul (~20 min subway). Morning coffee at Cafe Onion → boutique shopping → Hanjungsun fruit mochi → Rettre perfume experience → Seoul Forest cherry blossoms → DDP lit up at night. One neighbourhood, very walkable. ~15 min subway home."}, {"id": 5, "date": "Mar 29", "dow": "Sun", "city": "Seoul", "title": "Hongdae + Yeonnam", "subtitle": "West Seoul's creative cluster. Boutiques, indie cafes, a linear park, and great chicken.", "alerts": [{"type": "tip", "text": "Line 2 from City Hall to Hongdae/Hapjeong (~20 min). Start in Yeonnam early — Saturday gets busy fast."}], "bookings": [], "stops": [{"time": "9am", "name": "Yeonnam-dong Brunch", "type": "Quiet Artsy Neighborhood", "desc": "Tree-lined streets, very local feeling. Great cafe-hopping before the crowds arrive.", "tags": [{"t": "Most cafes open 10am", "c": "tip"}], "map": "https://maps.google.com/?q=Yeonnam-dong+Seoul"}, {"transport": "5 min walk to park"}, {"time": "10:30am", "name": "Gyeongui Line Forest Park", "type": "Linear Park · Old Railway", "desc": "6km park on a former railway through Hongdae and Yeonnam. Cafes and shops line both sides. Cherry blossoms possible.", "tags": [{"t": "Free · 24hrs", "c": "free"}, {"t": "Cherry blossoms likely", "c": "tip"}], "map": "https://maps.google.com/?q=Gyeongui+Line+Forest+Park+Seoul"}, {"time": "12pm", "name": "Shinleedoga Cafe", "type": "Iconic Hanok Cafe · Open Fire Pit", "desc": "Restored hanok with a fire pit where you roast marshmallows. One of Seoul most atmospheric cafes. The corn latte is famous.", "tags": [{"t": "Opens 11am", "c": "tip"}, {"t": "~8,000 won", "c": "food"}], "map": "https://maps.google.com/?q=Shinleedoga+Cafe+Seoul"}, {"time": "1-5pm", "name": "Hongdae Boutique Shopping", "type": "Korean Streetwear + Vintage", "desc": "Jandari-ro alley for indie Korean labels. Covernat, Post Archive Faction, and rotating concept stores. Underground arcade near Exit 9.", "tags": [{"t": "Open 12pm-10pm", "c": "tip"}, {"t": "Some cash only", "c": "warn"}, {"t": "Korean streetwear", "c": "shop"}], "map": "https://maps.google.com/?q=Hongdae+Jandari-ro+Seoul"}, {"time": "Evening", "name": "Hongdae Nightlife (optional)", "type": "Bars · Live Music · Street Performance", "desc": "Best live music and bar scene in Seoul. Plenty of rooftop bars and izakayas.", "tags": [{"t": "Bars from 8pm", "c": "tip"}], "map": "https://maps.google.com/?q=Hongdae+Seoul+nightlife"}], "eats": [{"meal": "Lunch", "name": "Ondare Jjimdalk", "type": "Braised Soy Chicken · Hongdae", "desc": "Jjimdalk is a beloved Korean dish — chicken, glass noodles, and vegetables braised in a deep savory-sweet soy sauce. This Hongdae branch was visited by Conan O'Brien and has been a local staple since. Cool brick wall vibe. Great for a solo sit-down lunch.", "order": "Jjimdalk S size (feeds 1-2 people easily). Get the spicy version for heat. The glass noodles soak up all the sauce — eat them last.", "tags": [{"t": "Chicken + noodles", "c": "food"}, {"t": "Spicy option", "c": "food"}, {"t": "~16,000-20,000 won", "c": "food"}, {"t": "No reservation", "c": "tip"}], "map": "https://maps.google.com/?q=Ondare+Jjimdalk+Hongdae+Seoul"}, {"meal": "Dinner", "name": "Menten Ramen", "type": "Michelin Bib Gourmand · Tantanmen · Myeongdong", "desc": "Tiny 10-seat ramen spot in Myeongdong, right near your hotel. Michelin Bib Gourmand. Only two things on the menu: tantanmen (spicy peanut broth) and shoyu ramen. The tantanmen is exceptional — rich, spicy, creamy peanut base. Order at the kiosk. Perfect end to a day on your feet.", "order": "Tantanmen — spicy peanut broth, the must-order. Add a soft-boiled egg. Pay at the kiosk before you sit down.", "tags": [{"t": "Spicy ramen", "c": "food"}, {"t": "Michelin Bib Gourmand", "c": "tip"}, {"t": "~12,000-15,000 won", "c": "food"}, {"t": "Near Myeongdong hotel", "c": "tip"}, {"t": "No reservation — tiny space", "c": "tip"}], "map": "https://maps.google.com/?q=Menten+Ramen+Myeongdong+Seoul"}, {"meal": "Lunch option", "name": "Mipildam", "type": "Michelin Bib Gourmand · Handmade Mandu Soup · Hapjeong", "desc": "A tiny, unpretentious spot in a youthful Hapjeong alley — Michelin Bib Gourmand for its Northern Korean-style handmade mandutguk (dumpling soup). The recipe is based on the grandmother's home recipe from Hwanghae Province. Plump dumplings with juicy filling in a light, clean broth with no artificial flavors. A beautiful contrast to a day of spicy food.", "order": "Mandutguk (dumpling soup) — the only thing you need. Plump dumplings, clean broth. Under ₩12,000. Add a side of kimchi if available.", "tags": [{"t": "Michelin Bib Gourmand", "c": "ticket"}, {"t": "Dumpling soup", "c": "food"}, {"t": "Hapjeong — near Hongdae", "c": "tip"}, {"t": "No reservation", "c": "tip"}, {"t": "~10,000-12,000 won", "c": "food"}], "map": "https://maps.google.com/?q=Mipildam+Hapjeong+Seoul"}], "cafes": [{"time": "Morning · 9am", "name": "Vimutti Coffee", "type": "Rustic Countryside Kitchen Cafe · Yeonnam-dong", "desc": "Tiny, cozy cafe in Yeonnam that feels like someone's farmhouse kitchen — warm wood, old crockery, mismatched chairs. Very local, not on the usual tourist trail. Famous for their cinnamon roll. The kind of place that makes you want to stay all morning.", "order": "Cinnamon roll (the whole reason to come) + Americano or flat white. Under 12,000 won total.", "map": "https://maps.google.com/?q=Vimutti+Coffee+Yeonnam+Seoul"}, {"time": "Afternoon · 2pm", "name": "Perception Coffee", "type": "Award-Winning Specialty Cafe · Hapjeong", "desc": "Award-winning specialty coffee shop near Hapjeong — famous for its stunning interior with a ceiling of flowing wooden waves. Serious coffee, exceptional latte, very cool space. A must for anyone who takes their coffee seriously.", "order": "Single origin filter or their signature latte. The coffee is the draw here — do not overthink it.", "map": "https://maps.google.com/?q=Perception+Coffee+Hapjeong+Seoul"}], "timeline": [{"time": "9am", "name": "Vimutti Coffee", "type": "Rustic Countryside Kitchen Cafe · Yeonnam-dong", "stopType": "cafe", "desc": "Tiny cozy cafe that feels like someone's farmhouse kitchen — warm wood, old crockery, mismatched chairs. Very local, not on the usual tourist trail. Famous cinnamon roll.", "order": "Cinnamon roll (the whole reason to come) + Americano or flat white. Under ₩12,000 total.", "hours": "9am–6pm, closed Mondays", "walk_next": "5 min walk to park", "map": "https://maps.google.com/?q=Vimutti+Coffee+Yeonnam+Seoul"}, {"time": "9:30am", "name": "Yeonnam-dong Morning Wander", "type": "Quiet Artsy Neighborhood", "stopType": "place", "desc": "Tree-lined streets, very local feeling. Great cafe-hopping before crowds arrive.", "hours": "Neighborhood always open", "walk_next": "5 min walk to park", "map": "https://maps.google.com/?q=Yeonnam-dong+Seoul"}, {"time": "10:30am", "name": "Gyeongui Line Forest Park", "type": "Linear Park · Old Railway · Cherry Blossoms", "stopType": "place", "desc": "6km park on a former railway through Hongdae and Yeonnam. Cafes and shops line both sides. Cherry blossoms very likely late March.", "hours": "Open 24hrs", "walk_next": "10 min walk to Shinleedoga", "tags": [{"t": "Free", "c": "free"}, {"t": "Cherry blossoms likely", "c": "tip"}], "map": "https://maps.google.com/?q=Gyeongui+Line+Forest+Park+Seoul"}, {"time": "12pm", "name": "Shinleedoga Cafe", "type": "Iconic Hanok Cafe · Open Fire Pit", "stopType": "cafe", "desc": "Restored hanok with a fire pit where you roast marshmallows. One of Seoul's most atmospheric cafes. The corn latte is famous. Doubles as a lunch break.", "order": "Corn latte (famous) + any seasonal pastry. Roast a marshmallow at the fire pit. ~₩8,000.", "hours": "11am–9pm daily", "walk_next": "5 min walk to lunch", "map": "https://maps.google.com/?q=Shinleedoga+Cafe+Seoul"}, {"time": "1pm", "name": "Mipildam", "type": "Michelin Bib Gourmand · Handmade Mandu Soup · Hapjeong", "stopType": "food", "desc": "Tiny unpretentious spot in a Hapjeong alley — Michelin Bib Gourmand for its Northern Korean-style handmade mandutguk. Based on the grandmother's home recipe from Hwanghae Province. Plump dumplings, clean broth, no artificial flavors.", "order": "Mandutguk (dumpling soup) — the only thing you need. Under ₩12,000.", "hours": "11:30am–3pm, 5pm–8:30pm, closed Sundays", "walk_next": "5 min walk to boutiques", "tags": [{"t": "Michelin Bib Gourmand", "c": "ticket"}, {"t": "~10,000-12,000 won", "c": "food"}, {"t": "No reservation", "c": "tip"}, {"t": "Closed Sundays", "c": "warn"}], "map": "https://maps.google.com/?q=Mipildam+Hapjeong+Seoul", "alts": ["Ondare Jjimdalk — braised soy chicken + glass noodles, Conan O'Brien visited, Hongdae"], "etiquette": "Small space — wait outside if full. Order from menu. Must order at least 1 item per person. Pay when leaving."}, {"time": "2pm", "name": "Hongdae Boutique Shopping", "type": "Korean Streetwear + Vintage · Jandari-ro Alley", "stopType": "place", "desc": "Jandari-ro alley for indie Korean labels. Covernat, Post Archive Faction, rotating concept stores.", "hours": "Most open 12pm–10pm", "walk_next": "15 min walk to Perception Coffee", "uber_next": "₩5,000 / 6 min", "tags": [{"t": "Open 12pm-10pm", "c": "tip"}, {"t": "Some cash only", "c": "warn"}], "map": "https://maps.google.com/?q=Hongdae+Jandari-ro+Seoul"}, {"time": "4pm", "name": "Perception Coffee", "type": "Award-Winning Specialty Cafe · Hapjeong", "stopType": "cafe", "desc": "Award-winning specialty coffee near Hapjeong — stunning interior with ceiling of flowing wooden waves. Serious coffee, exceptional latte.", "order": "Single origin filter or signature latte. The coffee is the draw — don't overthink it.", "hours": "11am–9pm daily", "walk_next": "Back into Hongdae for dinner", "map": "https://maps.google.com/?q=Perception+Coffee+Hapjeong+Seoul"}, {"time": "6:30pm", "name": "Ondare Jjimdalk", "type": "Braised Soy Chicken · Hongdae · Conan O'Brien Spot", "stopType": "food", "desc": "Jjimdalk is braised chicken with glass noodles in deep savory-sweet soy sauce. This Hongdae branch was visited by Conan O'Brien and has been a local staple since. "Back to hotel to collect luggage", "uber_next": "₩8,000 / 10 min", "tags": [{"t": "Korean designer labels", "c": "shop"}, {"t": "Line 3 Sinsa Stn Exit 8", "c": "tip"}], "map": "https://maps.google.com/?q=Garosu-gil+Seoul"}, {"transport": "🚇 Collect luggage from hotel → Subway Line 3 Sinsa → Line 1/4 Seoul Station (~35 min)"}, {"time": "1pm", "name": "Seoul Station — KTX to Busan", "type": "High Speed Train · ~2h40min", "stopType": "place", "desc": "Grab a kimbap or convenience store lunch on the platform. Arrive Busan Haeundae area ~4:30–5pm.", "hours": "KTX runs throughout the day", "tags": [{"t": "~59,800 won", "c": "ticket"}, {"t": "Book in advance", "c": "warn"}], "map": "https://maps.google.com/?q=Seoul+Station"}, {"transport": "🚕 Kakao Taxi from Busan Station to your apartment (Suyeong-gu) — ~₩15,000, 25 min"}, {"time": "~5pm", "name": "Arrive Haeundae — Check In + Beach Walk", "type": "Hotel + First Look at Busan", "stopType": "place", "desc": "Check in, drop bags, walk down to Haeundae Beach. Easy first evening in Busan.", "walk_next": "On the beachfront", "map": "https://maps.google.com/?q=Haeundae+Beach+Busan"}, {"time": "7pm", "name": "Dak-gukbap near Haeundae", "type": "Chicken Rice Soup · Welcome to Busan", "stopType": "food", "desc": "Busan comfort food — rice soup. Near Haeundae there are plenty of small local spots. Look for bright-lit places with plastic stools. Milky, rich, deeply satisfying after a long travel day.", "order": "Dak-gukbap (chicken rice soup) or tofu version. All come with kimchi and rice.", "hours": "Most open until 10pm+", "walk_next": "5 min walk back to hotel", "tags": [{"t": "~8,000-12,000 won", "c": "food"}, {"t": "No reservation", "c": "tip"}], "map": "https://maps.google.com/?q=gukbap+restaurant+Haeundae+Busan", "etiquette": "Walk in, sit down, point at menu or say 닭국밥 (dak-gukbap). Banchan (side dishes) are free refills — just ask. Pay at counter."}], "alternatives": [{"name": "Any convenience store kimbap", "type": "Quick
